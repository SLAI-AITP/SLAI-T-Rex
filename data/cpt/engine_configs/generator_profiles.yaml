        level_2: medium
        level_3: large
        level_4: stress
      constraint_tightness:
        level_1: loose
        level_2: moderate
        level_3: tight
        level_4: very_tight
    semantic_scenarios: []
    formulation_variants:
    - variant_id: base
      enabled: true
      notes: Static aircraft landing sequencing with pairwise order binaries, separation times, landing windows, and early/late penalty minimization.
    quality_risks:
    - LLM may confuse landing sequencing with fleet assignment
    - LLM may omit ordered-pair separation times
    - LLM may replace early/late penalty with makespan or delay-only objective
    - LLM may omit earliest/latest landing windows
    rationale_requirements:
    - explain actual landing time variables
    - explain binary pairwise order variables
    - explain minimum separation constraints
    - explain earliest/target/latest landing times
    - explain early and late deviation penalty objective
    quality_controls:
