      - added_unstated_constraint
      - wrong_variable_type
      - objective_mismatch
      - code_not_executable
      - scenario_math_mismatch
      - high_text_similarity
    max_views_per_seed_instance: 12
    expected_acceptance_rate: 0.35
    source_generator_name: AircraftLanding
    source: optmath_internal
