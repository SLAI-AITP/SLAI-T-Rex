version: v1.1.0
description: Project-local generator profiles for OR-CPT production.
defaults:
  difficulty_mix:
    level_1: 0.5
    level_2: 0.3
    level_3: 0.15
    level_4: 0.05
  expected_acceptance_rate: 0.35
profiles:
  optmath_aircraftassignment:
    enabled: true
    priority: medium
    recommended_weight: 1.0
    sampling_weight:
      cpt_weight: 1.0
      max_daily_samples: 2500
      min_quality_score: 0.65
      solver_timeout_seconds: 45
    task_family: assignment
    sub_family: integer_aircraft_fleet_assignment
    difficulty_support: basic
    default_variant_id: base
    modeling_concepts:
    - integer_allocation
    - fleet_availability_limit
    - route_demand_requirement
    - capacity_contribution_matrix
    - cost_minimization
    canonical_math_signature:
      variable_types:
      - nonnegative_integer_allocation
      objective_sense: minimize
      objective_terms:
      - aircraft_route_operating_cost_times_allocation
      core_constraints:
      - aircraft_type_availability_limit
      - route_capacity_meets_or_exceeds_demand
      - nonnegative_integer_allocation
      required_tables:
      - aircraft_type_availability_vector
      - route_demand_vector
      - aircraft_route_capacity_contribution_matrix
      - aircraft_route_cost_matrix
      - compact_aircraft_assignment_tables
      forbidden_changes:
      - do not model this as binary one-aircraft-to-one-route matching
      - do not add aircraft route continuity or time-expanded balance constraints
      - do not add passenger spill, recapture, or revenue-management variables
      - do not omit aircraft availability limits or route demand requirements
    difficulty_config:
      size_scale:
        level_1: small
        level_2: medium
        level_3: large
        level_4: stress
      constraint_tightness:
        level_1: loose
        level_2: moderate
        level_3: tight
        level_4: very_tight
    difficulty_axes:
      size_scale:
        level_1: small
        level_2: medium
        level_3: large
        level_4: stress
      constraint_tightness:
        level_1: loose
        level_2: moderate
        level_3: tight
        level_4: very_tight
    semantic_scenarios: []
    formulation_variants:
    - variant_id: base
      enabled: true
      notes: Integer fleet-to-route allocation with aircraft availability limits, route demand requirements, capacity contribution matrix, and operating-cost minimization.
    quality_risks:
    - LLM may convert integer allocation counts into binary assignment variables
    - LLM may require exact capacity equality instead of meet-or-exceed demand
    - LLM may add aircraft routing, sequencing, or time-expanded balance constraints
    - LLM may omit aircraft-route capacity contribution coefficients
    rationale_requirements:
    - explain integer aircraft-route allocation variables
    - explain aircraft type availability constraints
    - explain route capacity meeting or exceeding demand
    - explain aircraft-route cost and capacity contribution matrices
    - explicitly state that the model has no route sequencing or aircraft-flow continuity
    quality_controls:
      validation_required:
      - source_instance_parse_ok
      - gurobi_code_or_lp_executes
      - solver_status_recorded
      - objective_recomputed
      - constraint_residual_checked
      - no_forbidden_misframing
      - no_duplicate_exact_text
      - preserve_integer_allocation
      - preserve_availability_limits
      - preserve_route_demand_requirements
      rejection_reasons:
      - changed_objective_sense
      - missing_core_constraint
      - added_unstated_constraint
      - wrong_variable_type
      - objective_mismatch
      - code_not_executable
      - scenario_math_mismatch
      - high_text_similarity
    max_views_per_seed_instance: 12
    expected_acceptance_rate: 0.35
    source_generator_name: AircraftAssignment
    source: optmath_internal
  optmath_aircraftlanding:
    enabled: true
    priority: medium
    recommended_weight: 1.0
    sampling_weight:
      cpt_weight: 1.0
      max_daily_samples: 2500
      min_quality_score: 0.65
      solver_timeout_seconds: 45
    task_family: scheduling
    sub_family: aircraft_landing_scheduling
    difficulty_support: basic
    default_variant_id: base
    modeling_concepts:
    - continuous_landing_time
    - binary_pairwise_order
    - runway_separation
    - landing_time_window
    - early_late_deviation_penalty
    canonical_math_signature:
      variable_types:
      - continuous_landing_time
      - binary_pairwise_order
      - continuous_early_deviation
      - continuous_late_deviation
      objective_sense: minimize
      objective_terms:
      - early_landing_penalty
      - late_landing_penalty
      core_constraints:
      - one_precedence_order_for_each_aircraft_pair
      - minimum_separation_time_between_ordered_landings
      - aircraft_landing_time_window
      - early_deviation_lower_bound
      - late_deviation_lower_bound
      required_tables:
      - aircraft_target_landing_times
      - aircraft_earliest_latest_landing_windows
      - aircraft_early_late_penalties
      - ordered_pair_separation_times
      - compact_aircraft_landing_tables
      forbidden_changes:
      - do not rewrite as fleet assignment, route allocation, transportation, or facility location
      - do not add aircraft type availability or route demand constraints
      - do not omit pairwise landing separation constraints
      - do not replace early/late penalty objective with makespan or completion time
