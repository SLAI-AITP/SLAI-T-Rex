        - do not treat cumulative demand values as independent period demands
        - do not add zero final inventory as a separate hard constraint
      high_risk_failures:
        - cumulative_demand_interpreted_as_period_demand
        - backlog_variable_invented
        - capacity_expansion_variable_invented
        - period_capacity_missing
        - fixed_setup_cost_missing

  optmath_uncapacitatedlotsizing:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - continuous_order_quantity
        - continuous_ending_inventory
        - binary_order_setup
      common_variable_domains:
        order_quantity: continuous_nonnegative
        ending_inventory: continuous_nonnegative
        order_setup: binary
      valid_index_policy:
        use_only_declared_periods: true
        do_not_invent_capacity_resource_or_backlog_tables: true
      required_constraints:
        - inventory_balance
        - order_quantity_linked_to_binary_setup
        - zero_final_inventory
      required_objective_terms:
        - fixed_ordering_setup_cost
        - unit_order_cost
        - inventory_holding_cost
      forbidden_changes:
        - do not add production capacity constraints
        - do not introduce backlog or lost-sales variables
        - do not omit fixed ordering setup costs
        - do not reverse the inventory balance sign
      high_risk_failures:
        - capacity_constraint_invented
        - backlog_variable_invented
        - inventory_balance_sign_error
        - fixed_setup_cost_missing

  optmath_uncapacitatedlotsizingbacklogging:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - order_quantity
        - ending_inventory
        - backlog
        - binary_order_setup
      common_variable_domains:
        order_quantity: continuous_nonnegative
        ending_inventory: continuous_nonnegative
        backlog: continuous_nonnegative
        order_setup: binary
      valid_index_policy:
        use_only_declared_periods: true
        do_not_invent_capacity_or_resource_tables: true
      required_constraints:
        - net_inventory_balance_with_backlog_carryover
        - order_quantity_linked_to_binary_setup
        - zero_final_inventory
        - zero_final_backlog
      required_objective_terms:
        - fixed_ordering_setup_cost
        - unit_order_cost
        - inventory_holding_cost
        - backlog_penalty_cost
      forbidden_changes:
        - do not add production capacity constraints
        - do not drop backlog variables or backlog penalties
        - do not model backlog as lost sales
        - do not omit fixed ordering setup costs
        - do not replace carried backlog with independent per-period shortage slack
        - do not omit zero final inventory or zero final backlog constraints
      high_risk_failures:
        - balance_equation_sign_error
        - backlog_penalty_missing
        - setup_linking_missing
        - invented_capacity_constraint

  optmath_portfolio:
    answer_contract:
      model_type: convex_QP
      objective_sense_options: [minimize]
      required_variable_families:
        - continuous_asset_weight
      common_variable_domains:
        asset_weight: continuous_nonnegative
      valid_index_policy:
        use_only_declared_assets: true
        covariance_terms_use_declared_asset_pairs: true
      required_constraints:
        - full_investment_budget_weights_sum_to_one
        - minimum_expected_return_requirement
        - continuous_asset_weight_bounds
      required_objective_terms:
        - covariance_weight_quadratic_terms
      forbidden_changes:
        - do not introduce binary asset selection or cardinality variables
        - do not maximize expected return instead of minimizing variance
        - do not omit the covariance matrix
        - do not replace covariance risk with independent linear risk scores
        - do not add transaction costs or minimum-lot constraints
      high_risk_failures:
        - binary_asset_selection_invented
        - objective_sense_changed_to_maximize_return
        - covariance_terms_omitted
        - target_return_constraint_missing

  optmath_contractallocation:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - continuous_delivery_quantity
        - binary_producer_contract_incidence
      common_variable_domains:
        delivery_quantity: continuous_nonnegative
        producer_contract_incidence: binary
      valid_index_policy:
        use_only_declared_producers_and_contracts: true
        do_not_create_facilities_routes_regions_or_time_periods: true
      required_constraints:
        - producer_capacity
        - exact_contract_fulfillment
        - minimum_contributors_per_contract
        - delivery_activation_lower_bound_minimum_delivery
        - delivery_activation_upper_bound_contract_size
      forbidden_changes:
        - do not omit binary producer-contract incidence variables
        - do not weaken exact fulfillment into at-least or optional fulfillment
        - do not change delivered quantities into binary award-only decisions
        - do not convert the problem into facility location, transportation routing, or assignment-only matching
      high_risk_failures:
        - exact_fulfillment_weakened
        - incidence_variable_missing
        - minimum_delivery_linking_missing
        - placeholder_or_nonexecutable_code

defaults:
  default_linear_or_contract:
    model_type: LP_or_MILP
    objective_sense_options: [minimize, maximize]
    required_variable_families:
      - variables implied by the natural-language problem and source seed
    common_variable_domains:
      binary: use only for selection, assignment, activation, and yes/no decisions
      continuous_nonnegative: use for divisible flows, quantities, production, inventory, and blends
    valid_index_policy:
      use_only_declared_sets_and_indices: true
      do_not_invent_missing_tables_or_nested_fields: true
    required_constraints:
      - all capacity, demand, assignment, balance, and bound constraints stated in the problem
    forbidden_changes:
      - do not change objective sense
      - do not invent data fields, arcs, resources, costs, capacities, or eligibility matrices
      - do not replace a structured model family with a simpler unrelated model
    high_risk_failures:
      - objective_term_missing
      - invalid_index_set
      - missing_core_constraint

families:
  facility_location:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - open_facility_binary
        - assignment_or_flow
      common_variable_domains:
        facility_open: binary
        assignment: binary_or_continuous_as_source
        flow: continuous_nonnegative
      valid_index_policy:
        use_only_declared_facilities_and_customers: true
        do_not_create_complete_graph_unless_source_has_complete_graph: true
      required_constraints:
        - demand_assignment_or_satisfaction
        - facility_capacity_if_present
        - open_to_assignment_linking
      forbidden_changes:
        - do not invent hub_capacity
        - do not change minimize to maximize
        - do not add routing subtour constraints
      high_risk_failures:
        - invalid_index_set
        - missing_linking_constraint
        - objective_fixed_cost_missing

  lot_sizing:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - production_quantity
        - inventory
        - setup_indicator_if_setup_cost_present
      common_variable_domains:
        production_quantity: continuous_or_integer_as_source
        setup_indicator: binary
        inventory: continuous_nonnegative
      required_constraints:
        - inventory_balance
        - demand_satisfaction
        - setup_linking_if_setup_cost_present
        - capacity_if_present
      forbidden_changes:
        - do not drop backlog variables if source includes backlog
        - do not reverse inventory balance
      high_risk_failures:
        - objective_term_missing
        - balance_equation_sign_error

  covering:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - selected_set_binary
      common_variable_domains:
        selected_set: binary
      required_constraints:
        - every_element_covered
        - coverage_multiplicity_if_required
      forbidden_changes:
        - do not turn set cover into assignment
        - do not use continuous selected-set variables
      high_risk_failures:
        - missing_coverage_constraint
        - invalid_element_set

  revenue_management:
    answer_contract:
      model_type: LP_or_MILP
      objective_sense_options: [maximize]
      required_variable_families:
        - offer_or_allocation_decisions
      common_variable_domains:
        allocation: continuous_or_integer_as_source
        selected_offer: binary_if_source_has_selection
      required_constraints:
        - resource_capacity
        - demand_or_market_limit
        - eligibility_if_present
      forbidden_changes:
        - do not change profit maximization into cost minimization
        - do not invent demand classes
      high_risk_failures:
        - objective_sense_mismatch
        - capacity_constraint_missing

  transportation:
    answer_contract:
      model_type: LP
      objective_sense_options: [minimize]
      required_variable_families:
        - shipment_flow
      common_variable_domains:
        shipment: continuous_nonnegative
      valid_index_policy:
        use_only_declared_origin_destination_pairs: true
      required_constraints:
        - supply_capacity
        - demand_satisfaction
      forbidden_changes:
        - do not introduce vehicle routes
        - do not introduce binary assignment unless source explicitly requires it
      high_risk_failures:
        - invalid_lane_index
        - missing_supply_or_demand_balance

  packing:
    answer_contract:
      model_type: MILP
      objective_sense_options: [maximize, minimize]
      required_variable_families:
        - select_item_binary
        - bin_assignment_binary_if_bin_packing
      common_variable_domains:
        item_selection: binary
        bin_assignment: binary
      required_constraints:
        - capacity_limit
        - item_assignment_or_selection_logic
      forbidden_changes:
        - do not use fractional item selection for take-or-leave items
        - do not drop capacity constraints
      high_risk_failures:
        - variable_domain_wrong
        - capacity_constraint_missing

  scheduling:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize, maximize]
      required_variable_families:
        - assignment_or_start_time
        - sequencing_binary_if_required
      common_variable_domains:
        assignment: binary
        start_time: continuous_nonnegative
        sequence: binary
      required_constraints:
        - processing_or_assignment_requirement
        - machine_or_resource_capacity
        - precedence_or_nonoverlap_if_present
      forbidden_changes:
        - do not ignore precedence constraints
        - do not convert sequencing to independent selection
      high_risk_failures:
        - missing_nonoverlap_constraint
        - invalid_time_index

  routing:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - route_arc_binary
        - arrival_time_if_time_windows_present
      common_variable_domains:
        route_arc: binary
        arrival_time: continuous_nonnegative
      valid_index_policy:
        use_only_declared_arcs: true
      required_constraints:
        - visit_or_service_constraints
        - flow_conservation
        - capacity_if_present
        - time_window_if_present
      forbidden_changes:
        - do not omit time windows when source includes them
        - do not create arcs not present in source arc set
      high_risk_failures:
        - infeasible_generated_code
        - invalid_arc_index
        - subtour_constraint_missing

  network_flow:
    answer_contract:
      model_type: LP_or_MILP
      objective_sense_options: [minimize, maximize]
      required_variable_families:
        - arc_flow
        - arc_activation_if_fixed_charge
      common_variable_domains:
        flow: continuous_nonnegative
        activation: binary_if_source_has_fixed_charge
      valid_index_policy:
        use_only_declared_nodes_and_arcs: true
      required_constraints:
        - flow_balance_or_conservation
        - arc_capacity_if_present
        - activation_linking_if_present
      forbidden_changes:
        - do not build a complete graph unless the source gives complete arcs
        - do not drop commodity or period indices
      high_risk_failures:
        - invalid_arc_index
        - missing_flow_balance

  supply_chain:
    answer_contract:
      model_type: LP_or_MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - production
        - shipment
        - inventory
        - activation_if_present
      common_variable_domains:
        production: continuous_or_integer_as_source
        shipment: continuous_nonnegative
        inventory: continuous_nonnegative
        activation: binary_if_source_has_setup_or_opening
      required_constraints:
        - material_balance
        - demand_satisfaction
        - capacity
        - inventory_carryover_if_multiperiod
      forbidden_changes:
        - do not collapse multi-echelon or multi-period structure
        - do not drop inventory balance
      high_risk_failures:
        - balance_equation_sign_error
        - objective_term_missing

  diet:
    answer_contract:
      model_type: LP
      objective_sense_options: [minimize]
      required_variable_families:
        - food_or_ingredient_quantity
      common_variable_domains:
        quantity: continuous_nonnegative
      required_constraints:
        - nutrient_minimum_or_range
        - availability_or_quantity_bounds_if_present
      forbidden_changes:
        - do not use binary food choices unless explicitly stated
        - do not reverse nutrient lower and upper bounds
      high_risk_failures:
        - nutrient_bound_direction_error
        - objective_cost_missing

  blending:
    answer_contract:
      model_type: LP
      objective_sense_options: [minimize, maximize]
      required_variable_families:
        - ingredient_quantity
        - blend_output_quantity_if_present
      common_variable_domains:
        ingredient_quantity: continuous_nonnegative
      required_constraints:
        - material_balance
        - quality_ratio_or_specification
      forbidden_changes:
        - do not linearize ratios incorrectly when source has weighted averages
        - do not invent unavailable ingredients
      high_risk_failures:
        - quality_constraint_missing
        - ratio_constraint_error

  portfolio:
    answer_contract:
      model_type: LP_or_MILP
      objective_sense_options: [maximize, minimize]
      required_variable_families:
        - allocation_weight
        - selected_asset_binary_if_cardinality_present
      common_variable_domains:
        allocation: continuous_nonnegative
        selected_asset: binary_if_source_has_cardinality_or_selection
      required_constraints:
        - budget_or_total_weight
        - return_requirement_if_present
        - risk_bound_if_present
        - allocation_bounds
      forbidden_changes:
        - do not drop risk or return requirements
        - do not force equal allocation unless source requires it
      high_risk_failures:
        - missing_risk_constraint
        - budget_constraint_missing
