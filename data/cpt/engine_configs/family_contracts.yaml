version: v1.0.0

generator_aliases:
  facility_location:
    - facility
    - cflp
    - location
    - scooter_location
  lot_sizing:
    - lotsizing
    - bucket
    - clsp
  covering:
    - setcover
    - multisetcover
    - cover
  revenue_management:
    - revenue
    - marketshare
    - contractallocation
  transportation:
    - transp
    - transportation
  packing:
    - knapsack
    - binpacking
    - packing
  scheduling:
    - scheduling
    - flowshop
    - jopshop
    - jobshop
  routing:
    - routing
    - vrp
    - aircraftlanding
    - fleet
  network_flow:
    - network
    - shortest_path
    - mcnd
  supply_chain:
    - supplychain
    - supply_chain
  diet:
    - diet
  blending:
    - blending
  portfolio:
    - portfolio
  contract_allocation:
    - contractallocation
    - contract_allocation
    - split_award

generator_overrides:
  optmath_carselection:
    answer_contract:
      model_type: MILP
      objective_sense_options: [maximize]
      required_variable_families:
        - binary_participant_car_assignment
      common_variable_domains:
        assignment: binary
      valid_index_policy:
        use_only_declared_participants_cars_and_eligibility_matrix: true
        do_not_create_route_time_vehicle_capacity_or_score_indices: true
      required_constraints:
        - assignment_only_if_eligible
        - participant_at_most_one_car
        - car_at_most_one_participant
      required_objective_terms:
        - one_unit_value_per_selected_assignment
      forbidden_changes:
        - do not introduce assignment costs, scores, distances, or revenues absent from the source
        - do not require every participant or every car to be assigned
        - do not replace at-most-one constraints with exact assignment constraints
        - do not reinterpret as transportation, routing, scheduling, or fleet allocation
      high_risk_failures:
        - eligibility_matrix_missing
        - objective_changed_to_cost_minimization
        - full_assignment_required_without_source_support
        - routing_or_transportation_reinterpretation

  optmath_cell_tower:
    answer_contract:
      model_type: MILP
      objective_sense_options: [maximize]
      required_variable_families:
        - binary_tower_build
        - binary_region_covered
      common_variable_domains:
        build: binary
        covered: binary
      valid_index_policy:
        use_only_declared_towers_regions_and_coverage_matrix: true
        do_not_create_customer_assignment_shipment_capacity_route_or_time_indices: true
      required_constraints:
        - region_coverage_linking
        - tower_budget_limit
      required_objective_terms:
        - region_population_times_covered_binary
      forbidden_changes:
        - do not require every region to be covered
        - do not change covered-population maximization into setup-cost minimization
        - do not introduce shipment quantities, customer assignments, capacities, vehicles, routes, or time windows
        - do not reinterpret as capacitated facility location or transportation
      high_risk_failures:
        - coverage_matrix_missing
        - budget_constraint_missing
        - all_regions_forced_covered
        - cflp_or_transportation_reinterpretation

  optmath_revenue:
    answer_contract:
      model_type: MILP
      objective_sense_options: [maximize]
      required_variable_families:
        - nonnegative_integer_package_sales
      common_variable_domains:
        package_sales: nonnegative_integer
      valid_index_policy:
        use_only_declared_packages_resources_and_usage_matrix: true
        do_not_create_time_period_dynamic_pricing_or_stochastic_arrival_indices: true
      required_constraints:
        - package_demand_upper_bound
        - resource_capacity_consumption_limit
        - nonnegative_integer_package_sales
      required_objective_terms:
        - package_revenue_times_package_sales
      forbidden_changes:
        - do not change revenue maximization into cost minimization
        - do not introduce dynamic pricing, booking periods, stochastic arrivals, or bid-price controls
        - do not omit package demand upper bounds
        - do not omit the package-resource usage matrix
        - do not omit resource capacity constraints
      high_risk_failures:
        - objective_sense_mismatch
        - package_demand_limit_missing
        - resource_usage_matrix_missing
        - capacity_constraint_missing

  optmath_cflp:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - binary_facility_opening
        - continuous_customer_facility_shipment
      common_variable_domains:
        facility_open: binary
        shipped_amount: continuous_nonnegative
      valid_index_policy:
        use_only_declared_customers_and_facilities: true
        do_not_create_vehicle_route_time_or_inventory_indices: true
      required_constraints:
        - customer_demand_exactly_satisfied
        - ship_only_from_open_facility
        - open_facility_capacity_limit
      required_objective_terms:
        - facility_fixed_opening_cost
        - customer_facility_transport_cost_times_shipped_amount
      forbidden_changes:
        - do not remove binary FacilityOpen[j] decisions
        - do not remove fixed facility opening costs
        - do not relax exact customer demand satisfaction into optional service
        - do not omit ShippedAmount[i,j] <= demand[i] * FacilityOpen[j] linking
        - do not omit capacity[j] * FacilityOpen[j] capacity linking
        - do not add vehicles, tours, time windows, subtour constraints, or route sequencing
      high_risk_failures:
        - pure_transportation_reinterpretation
        - fixed_opening_cost_missing
        - open_before_ship_linking_missing
        - capacity_linking_missing

  optmath_revenue_management:
    answer_contract:
      model_type: MILP
      objective_sense_options: [maximize]
      required_variable_families:
        - nonnegative_integer_package_sales
      common_variable_domains:
        package_sales: nonnegative_integer
      valid_index_policy:
        use_only_declared_packages_resources_and_usage_matrix: true
        do_not_create_time_period_dynamic_pricing_or_stochastic_arrival_indices: true
      required_constraints:
        - package_demand_upper_bound
        - resource_capacity_consumption_limit
        - nonnegative_integer_package_sales
      required_objective_terms:
        - package_revenue_times_package_sales
      forbidden_changes:
        - do not change revenue maximization into cost minimization
        - do not introduce dynamic pricing, booking periods, stochastic arrivals, or bid-price controls
        - do not omit package demand upper bounds
        - do not omit the package-resource usage matrix
        - do not omit resource capacity constraints
      high_risk_failures:
        - objective_sense_mismatch
        - package_demand_limit_missing
        - resource_usage_matrix_missing
        - capacity_constraint_missing

  optmath_marketshare:
    answer_contract:
      model_type: MILP
      objective_sense_options: [maximize]
      required_variable_families:
        - nonnegative_integer_company_market_product_supply
      common_variable_domains:
        supply: nonnegative_integer
      valid_index_policy:
        use_only_declared_companies_markets_products: true
        do_not_create_resource_capacity_budget_channel_or_price_indices: true
      required_constraints:
        - market_product_demand_exactly_satisfied
        - nonnegative_integer_supply
      required_objective_terms:
        - net_profit_times_integer_supply
      forbidden_changes:
        - do not change profit maximization into cost minimization
        - do not introduce resource capacity, budget, channel capacity, eligibility, or nonlinear market-response constraints absent from the source
        - do not relax exact market-product demand fulfillment into optional market coverage
        - do not convert integer supply quantities into binary campaign-selection variables
      high_risk_failures:
        - objective_sense_mismatch
        - demand_fulfillment_missing
        - resource_capacity_invented
        - integer_supply_domain_lost

  optmath_transp:
    answer_contract:
      model_type: LP
      objective_sense_options: [minimize]
      required_variable_families:
        - continuous_nonnegative_shipment
      common_variable_domains:
        shipment: continuous_nonnegative
      valid_index_policy:
        use_only_declared_origins_destinations_and_complete_lane_table: true
        do_not_create_vehicle_route_time_capacity_activation_or_facility_indices: true
      required_constraints:
        - origin_supply_exactly_shipped
        - destination_demand_exactly_received
        - nonnegative_continuous_shipments
      required_objective_terms:
        - lane_unit_cost_times_transport_quantity
      forbidden_changes:
        - do not add vehicles, tours, time windows, subtour constraints, or route sequencing
        - do not add lane capacity, fixed-charge activation, facility opening, or binary lane decisions
        - do not add unmet-demand slack or optional unused supply
        - do not reveal or force internally generated feasible shipment certificates
      high_risk_failures:
        - supply_or_demand_balance_missing
        - lane_cost_matrix_missing
        - vehicle_routing_reinterpretation
        - capacity_or_fixed_charge_added

  optmath_tsp:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - binary_directed_route_arc
        - integer_mtz_order_variable
      common_variable_domains:
        route_arc: binary
        mtz_order: integer
      valid_index_policy:
        use_complete_declared_directed_city_arc_set_without_self_loops: true
        do_not_create_vehicle_capacity_time_window_service_or_delivery_indices: true
      required_constraints:
        - exactly_one_inbound_arc_per_city
        - exactly_one_outbound_arc_per_city
        - single_tour_mtz_subtour_elimination
      required_objective_terms:
        - directed_arc_distance_times_route_binary
      forbidden_changes:
        - do not add vehicle capacity, time windows, service times, delivery quantities, or multiple vehicles
        - do not simplify to shortest path, transportation, assignment-only matching, or path flow
        - do not omit subtour-elimination logic
        - do not add arcs outside the complete directed city-pair table
      high_risk_failures:
        - capacity_or_time_window_added
        - subtour_elimination_missing
        - shortest_path_reinterpretation
        - objective_distance_terms_missing

  optmath_the_shortest_path_problem:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - binary_path_arc_selection
      common_variable_domains:
        path_arc: binary
      valid_index_policy:
        use_only_declared_nodes_and_directed_arcs: true
        do_not_expand_sparse_dag_to_complete_graph: true
        do_not_create_vehicle_route_time_capacity_or_facility_indices: true
      required_constraints:
        - source_sink_flow_balance
        - intermediate_node_flow_conservation
      required_objective_terms:
        - arc_cost_times_binary_path_arc
      forbidden_changes:
        - do not add arc capacity limits, fixed charges, vehicle routes, subtours, time windows, or facility-opening decisions
        - do not turn the source-sink path into a traveling-salesperson tour
        - do not add unmet-demand slack or optional path completion
        - do not create arcs outside the declared directed arc set
      high_risk_failures:
        - arc_capacity_added
        - complete_graph_reinterpretation
        - tsp_tour_reinterpretation
        - source_sink_balance_missing

  optmath_scooter_location:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - binary_station_opening
        - binary_demand_assignment
        - nonnegative_integer_new_scooter_count
      common_variable_domains:
        station_open: binary
        demand_assignment: binary
        new_scooters: nonnegative_integer
      valid_index_policy:
        use_only_declared_demand_points_and_candidate_locations: true
        do_not_create_route_sequence_vehicle_or_time_indices: true
      required_constraints:
        - each_demand_point_assigned_exactly_once
        - assign_only_to_selected_location
        - selected_location_capacity_with_existing_and_new_scooters
        - maximum_selected_locations
        - total_new_scooter_budget
        - new_scooters_only_at_selected_locations
      required_objective_terms:
        - demand_weighted_walking_distance
        - station_opening_cost
        - new_scooter_deployment_cost
      forbidden_changes:
        - do not drop station opening costs or new scooter deployment costs
        - do not relax exact demand assignment into optional service
        - do not allow new scooters at unselected stations
        - do not reinterpret as vehicle routing, TSP, shortest path, or station visit sequencing
      high_risk_failures:
        - new_scooter_variable_missing
        - station_capacity_missing
        - opening_or_deployment_cost_missing
        - routing_reinterpretation

  optmath_aircraftassignment:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - integer_fleet_allocation_count
      common_variable_domains:
        allocation: nonnegative_integer
      valid_index_policy:
        use_only_declared_aircraft_types_and_routes: true
        do_not_create_aircraft_tail_route_sequence_or_time_indices: true
      required_constraints:
        - aircraft_type_availability_capacity
        - route_demand_requirement
      required_objective_terms:
        - aircraft_route_operating_cost
      forbidden_changes:
        - do not convert integer fleet counts into binary one-aircraft-to-one-route matching
        - do not add aircraft routing, sequencing, or time-expanded balance constraints
        - do not add passenger spill, recapture, or revenue-management variables
        - do not omit aircraft-route capacity contribution coefficients
        - do not expose or use an internal feasible allocation certificate as problem data
      high_risk_failures:
        - binary_assignment_reinterpretation
        - route_demand_missing
        - aircraft_availability_missing
        - time_expanded_routing_added

  optmath_aircraftlanding:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - binary_pairwise_order
        - continuous_landing_time
        - continuous_early_deviation
        - continuous_late_deviation
      common_variable_domains:
        aircraft_order: binary
        landing_time: continuous_nonnegative
        early_deviation: continuous_nonnegative
        late_deviation: continuous_nonnegative
      valid_index_policy:
        use_only_declared_aircraft_and_ordered_aircraft_pairs: true
        do_not_create_aircraft_types_routes_or_fleet_assignment_indices: true
      required_constraints:
        - one_precedence_order_for_each_aircraft_pair
        - minimum_separation_time_between_ordered_landings
        - aircraft_landing_time_window
        - early_deviation_lower_bound
        - late_deviation_lower_bound
      required_objective_terms:
        - early_landing_penalty
        - late_landing_penalty
      forbidden_changes:
        - do not convert landing sequencing into aircraft fleet assignment
        - do not add route demand, capacity contribution, or operating cost matrices
        - do not omit pairwise separation times
        - do not omit earliest, target, and latest landing times
        - do not replace early/late penalty minimization with makespan minimization
        - do not present big-M as an operational business input
      high_risk_failures:
        - fleet_assignment_reinterpretation
        - separation_constraints_missing
        - time_windows_missing
        - early_late_penalty_missing

  optmath_schedulingproblem:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - binary_site_employee_shift_skill_assignment
        - integer_unfilled_position_slack
      common_variable_domains:
        assignment: binary
        unfilled_positions: nonnegative_integer
      valid_index_policy:
        use_only_declared_sites_employees_shifts_skills: true
        do_not_invent_processing_times_or_machine_sets: true
        positive_demand_table_may_omit_zero_demand_roles: true
      required_constraints:
        - coverage_equal_demand_with_shortage
        - employee_shift_availability
        - employee_skill_eligibility
        - at_most_one_total_assignment_per_employee
      required_objective_terms:
        - employee_skill_preference_assignment_cost
        - unfilled_position_penalty
      forbidden_changes:
        - do not add sequencing, non-overlap, due-date, routing, or machine-capacity constraints
        - do not drop shortage slack variables or shortage penalty
        - do not change minimize into maximize
        - do not require all demand to be filled without unfilled-position slack
        - do not allow one employee to take multiple total assignments
        - do not reveal or force any internal demand-generation staff sample
      high_risk_failures:
        - shortage_slack_missing
        - skill_or_availability_constraint_missing
        - objective_penalty_term_missing
        - positive_demand_zeros_misread
        - internal_staff_sample_leaked

  optmath_flowshop_2:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - binary_job_sequence_position_assignment
        - nonnegative_start_time_by_position_and_machine
        - explicit_makespan_variable
      common_variable_domains:
        job_position_assignment: binary
        start_time: continuous_nonnegative
        makespan: continuous_nonnegative
      valid_index_policy:
        use_only_declared_jobs_sequence_positions_and_machines: true
        use_one_common_sequence_for_all_machines: true
        job_sequence_assignment_is_not_machine_specific: true
      required_constraints:
        - one_job_per_sequence_position
        - one_sequence_position_per_job
        - stage_precedence_for_each_position
        - adjacent_position_ordering_on_each_machine
        - makespan_completion_bound
      required_objective_terms:
        - explicit_makespan_variable
        - final_position_completion_bound_on_last_machine
      forbidden_changes:
        - do not add due dates, release dates, or tardiness variables
        - do not replace the common permutation sequence with machine-specific sequences
        - do not convert into job shop with job-specific machine routes
        - do not create assignment variables indexed by machine
        - do not reinterpret final-machine processing-time coefficients as assignment costs, delay weights, or weighted completion costs
        - do not put final-machine processing-time coefficients directly into an assignment-cost objective
        - do not minimize total processing time, total completion time, or weighted completion time
      high_risk_failures:
        - makespan_objective_replaced
        - explicit_makespan_variable_missing
        - makespan_completion_bound_missing
        - common_sequence_constraint_missing
        - processing_time_table_omitted
        - independent_machine_sequences_added
        - objective_coefficients_misread_as_costs

  optmath_fleet_routing:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - integer_flight_leg_count
        - idle_fleet_count
        - initial_fleet_placement
      common_variable_domains:
        flight_leg_count: nonnegative_integer
        idle_fleet_count: nonnegative_integer
        initial_fleet_placement: nonnegative_integer
      valid_index_policy:
        use_only_declared_fleet_types_locations_periods_and_feasible_legs: true
        demand_exists_only_on_active_legs: true
      required_constraints:
        - initial_fleet_balance_by_location
        - time_expanded_fleet_flow_conservation
        - fleet_availability_by_type
        - active_leg_passenger_demand_satisfaction
        - inactive_leg_route_restriction
      required_objective_terms:
        - fleet_type_operating_cost_per_assigned_leg
      forbidden_changes:
        - do not add visit-once or subtour-elimination constraints
        - do not require binary route-arc variables
        - do not create passenger demand on inactive legs
        - do not convert to a customer-stop VRP
        - do not omit idle fleet variables or initial fleet placement variables
        - do not add service-time, load-propagation, or customer time-window constraints
      high_risk_failures:
        - aircraft_flow_balance_missing
        - fleet_availability_missing
        - active_leg_demand_missing
        - binary_vrp_reinterpretation
        - idle_state_variables_missing
        - inactive_leg_restriction_missing

  optmath_vrptw:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - binary_directed_arc_visit
        - continuous_service_start_time
        - continuous_cumulative_load
      common_variable_domains:
        arc_visit: binary
        service_start_time: continuous_nonnegative
        cumulative_load: continuous_nonnegative
      valid_index_policy:
        use_only_declared_depot_customer_nodes_and_directed_arcs: true
        exactly_one_vehicle_available: true
        do_not_create_vehicle_indices_or_multiple_route_sets: true
      required_constraints:
        - no_self_arcs
        - each_customer_has_one_incoming_arc
        - each_customer_has_one_outgoing_arc
        - single_route_leaves_the_depot_once
        - single_route_returns_to_the_depot_once
        - time_propagation_with_service_times_on_used_arcs
        - customer_service_start_time_windows
        - cumulative_load_propagation_on_used_arcs
        - single_vehicle_capacity
      required_objective_terms:
        - directed_travel_distance_times_arc_visit
      forbidden_changes:
        - do not introduce multiple vehicles, vehicle indices, fleet-sizing decisions, or customer-to-vehicle assignment variables
        - do not describe the source problem as a fleet with multiple independent routes
        - do not split customers across separate routes
        - do not convert the problem into transportation flow without visit sequencing
        - do not omit service times from time propagation
        - do not omit customer time windows
        - do not omit cumulative load and single-vehicle capacity constraints
        - do not change the depot or customer set
        - do not reveal or force the internally generated feasible route
      high_risk_failures:
        - multi_vehicle_reinterpretation
        - fleet_or_multiple_routes_wording
        - route_continuity_missing
        - time_window_or_service_time_missing
        - capacity_or_load_propagation_missing
        - transportation_flow_reinterpretation

  optmath_facility_location:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - selected_distribution_center_binary
        - served_zone_assignment_binary
        - multi_commodity_shipment_flow
      common_variable_domains:
        selected_distribution_center: binary
        served_zone_assignment: binary
        shipment: continuous_nonnegative
      valid_index_policy:
        use_only_declared_commodities_plants_distribution_centers_and_zones: true
        do_not_create_vehicle_routes_or_customer_sequences: true
      required_constraints:
        - plant_commodity_supply_capacity
        - served_zone_commodity_demand_exactly_shipped
        - each_zone_assigned_to_exactly_one_distribution_center
        - explicit_distribution_center_open_before_zone_assignment
        - distribution_center_minimum_throughput_if_selected
        - distribution_center_maximum_throughput_if_selected
      required_objective_terms:
        - plant_to_distribution_center_to_zone_variable_shipping_cost
        - fixed_distribution_center_selection_cost
        - unit_distribution_center_throughput_cost
      forbidden_changes:
        - do not omit fixed distribution-center selection costs
        - do not omit unit throughput costs
        - do not omit explicit Served[d,z] <= Selected[d] linking
        - do not collapse multi-commodity shipments into a simple zone assignment
        - do not add vehicle-routing, subtour, or visit-order constraints
      high_risk_failures:
        - fixed_cost_missing
        - throughput_cost_missing
        - open_before_assignment_link_missing
        - demand_equality_weakened
        - shipment_index_collapsed

  optmath_multisetcover:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - binary_set_selection
      common_variable_domains:
        set_selection: binary
      valid_index_policy:
        use_only_declared_candidate_sets_and_elements: true
        coverage_membership_is_declared_set_to_element_matrix: true
        coverage_requirements_are_lower_bounds: true
        do_not_create_flow_route_assignment_or_capacity_indices: true
      required_constraints:
        - element_multicover_requirement_lower_bound
      required_objective_terms:
        - selected_set_cost
      forbidden_changes:
        - do not convert binary set selection into continuous coverage quantities
        - do not replace multicover requirements with ordinary single-cover requirements
        - do not replace >= required coverage lower bounds with exact equality
        - do not omit candidate sets, elements, costs, coverage requirements, or coverage memberships
        - do not invent coverage memberships not listed in the set table
        - do not add routing, flow, assignment, scheduling, budget, or capacity constraints
      high_risk_failures:
        - coverage_matrix_incomplete
        - multicover_requirement_downgraded_to_single_cover
        - coverage_lower_bound_changed_to_equality
        - selected_set_cost_missing
        - binary_selection_relaxed

  optmath_cut_edited:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
      required_variable_families:
        - nonnegative_integer_pattern_count
      common_variable_domains:
        pattern_count: nonnegative_integer
      valid_index_policy:
        use_only_declared_order_widths_and_cutting_patterns: true
        pattern_piece_counts_are_declared_width_pattern_matrix: true
        stock_roll_width_is_fixed_for_all_patterns: true
        do_not_create_set_cover_elements_bins_routes_or_jobs: true
      required_constraints:
        - exact_order_width_fulfillment
        - pattern_width_feasibility
      required_objective_terms:
        - total_raw_roll_count
      forbidden_changes:
        - do not make Cut[j] binary; it is a nonnegative integer pattern-count variable
        - do not replace exact order-width fulfillment with optional or at-least fulfillment
        - do not invent cutting patterns or piece counts not listed in the pattern table
        - do not reinterpret this as set cover, bin packing, vehicle routing, or job scheduling
        - do not add assignment, facility-location, route, sequencing, or capacity-allocation variables
      high_risk_failures:
        - binary_pattern_selection_reinterpretation
        - pattern_matrix_incomplete
        - exact_fulfillment_weakened
        - raw_roll_objective_missing
        - set_cover_or_bin_packing_reinterpretation

  optmath_singlelevelsmallbucket:
    answer_contract:
      model_type: MILP
      objective_sense_options: [minimize]
