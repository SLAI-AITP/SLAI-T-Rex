  optmath_tsp:
    task_family: routing
    business_triggers:
      - before a one-day inspection tour is assigned
      - after travel distances were refreshed
      - before a field team locks its visit sequence
      - during a route-distance reduction review
      - after a depot-based service route was replanned
    applicability:
      required_source_features:
        - city or stop set
        - depot/start city
        - complete directed travel-distance table for i != j
        - binary route[i,j] directed arc variable
        - exactly one inbound arc per city
        - exactly one outbound arc per city
        - MTZ subtour-elimination order variables
      incompatible_source_features:
        - vehicle capacity
        - time windows
        - service times
        - multiple vehicles
        - pickup or delivery quantities
        - source-sink path only
        - transportation supply-demand matrix
    required_parameter_presentation:
      - list every city or stop and identify the depot/start
      - list the complete directed distance table for every ordered pair i != j
      - state route[i,j] is binary
      - state every city has exactly one inbound and one outbound selected arc
      - state MTZ order variables eliminate subtours
      - state there is one single tour that returns to the depot
      - state there are no capacity, time-window, service-time, or multi-vehicle constraints
    forbidden_misframings:
      - Do not add vehicle capacity or time windows.
      - Do not describe multiple vehicles or multiple independent routes.
      - Do not turn the tour into a shortest path from source to sink.
      - Do not turn it into transportation flow or assignment-only matching.
      - Do not omit subtour-elimination logic.
    modeling_notes:
      - This source is a pure TSP with complete directed city-pair distances and MTZ subtour elimination.
