  optmath_cut_edited:
    task_family: cutting_stock
    business_triggers:
      - after customer order sizes were finalized
      - before releasing a cutting plan to production
      - during a waste-reduction planning review
      - after raw stock availability changed
      - before a fabrication batch is scheduled
    applicability:
      required_source_features:
        - stock roll or board width
        - order width set
        - required piece count for each order width
        - listed cutting pattern set
        - pattern-width piece count matrix
        - nonnegative integer Cut[j] pattern-count variables
        - exact order-width fulfillment constraints
        - objective minimizing total stock rolls used
      incompatible_source_features:
        - binary set selection
        - bin assignment variables
        - customer routing or sequencing
        - facility opening decisions
        - production-machine scheduling
        - optional order fulfillment or lost sales
    required_parameter_presentation:
      - list the stock roll width
      - list every order width and required piece count
      - list every cutting pattern and piece counts by width
      - state Cut[j] is a nonnegative integer count of stock rolls cut by pattern j
      - state each order width must be fulfilled exactly
      - state the objective minimizes the total number of stock rolls used
    forbidden_misframings:
      - Do not describe this as set cover or multicover.
      - Do not describe this as bin packing with item-to-bin assignment.
      - Do not make Cut[j] binary.
      - Do not replace exact order fulfillment with optional or at-least fulfillment.
      - Do not invent cutting patterns or piece counts.
    modeling_notes:
