        entities: [part families, weeks, lot releases, setup decisions, inventory, shop capacity]
      - scenario_id: clsp_medical_kit_batch_plan
        industry: healthcare operations
        background: a hospital sterilization unit plans kit batches over a recovery window under fixed processing capacity
        entities: [kit types, days, production batches, setup decisions, inventory, processing capacity]
      - scenario_id: clsp_food_processing_shift_plan
