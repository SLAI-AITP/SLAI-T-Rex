  optmath_vrptw:
    task_family: routing
    business_triggers:
      - before a single-vehicle dispatch route is released
      - after appointment windows were confirmed
      - during a same-day route recovery cycle
      - before the driver leaves the depot
    applicability:
      required_source_features:
        - one depot and a set of customers
        - exactly one vehicle
        - binary directed arc routing variables
        - one incoming and one outgoing arc for each customer
        - one depot departure and one depot return
        - customer demand and single-vehicle capacity
        - service time and time window for each customer
        - directed travel distance or travel-time matrix
      incompatible_source_features:
        - multiple vehicle types or fleet-sizing decisions
        - assigning customers to different vehicle routes
        - pickup-delivery precedence pairs
        - transportation flow without visit sequencing
        - facility opening or location decisions
    required_parameter_presentation:
      - state that exactly one vehicle is available
      - state there is exactly one depot-to-depot route, not a fleet of routes
      - list depot and customer nodes
      - list customer demand, service time, and time window for every customer
      - list vehicle capacity
      - list the full directed distance or travel-time matrix
      - state each customer is visited exactly once
      - state the route starts and ends at the depot
    forbidden_misframings:
      - Do not introduce multiple vehicles.
      - Do not use phrases such as fleet, all routes, per-courier routes, or each courier route.
      - Do not assign customers to separate routes.
      - Do not omit service times or time windows.
      - Do not omit cumulative load and vehicle capacity.
      - Do not describe this as transportation flow.
      - Do not reveal or constrain the solution to the internally generated feasible route.
    modeling_notes:
      - Preserve the single-vehicle route structure.
      - Time propagation must include travel time and service time.
      - Load propagation must accumulate demand along the route.
      - The latent feasible route is a generation certificate and should not be revealed as the answer.
    scenario_lenses:
      - lens_id: single_vehicle_last_mile_route
        industry: last-mile delivery
        context: plan one depot-to-depot delivery route for a single vehicle with appointment windows
