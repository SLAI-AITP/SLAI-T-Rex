  optmath_netasgn:
    task_family: assignment
    business_triggers:
      - after available resource hours were reconciled with request requirements
      - before a weekly service allocation plan is approved
      - after a capacity shortage required reallocating specialist hours
      - during a budget review for assignment costs
      - before client commitments are locked for the next planning window
      - after a service-level risk alert exposed under-covered requests
    applicability:
      required_source_features:
        - person or resource set with available hours
        - project or request set with required hours
        - total available hours equals total required hours
        - continuous nonnegative assigned-hour variable x[i,j]
        - complete cost-per-hour matrix for every person-project pair
        - complete maximum contribution matrix for every person-project pair
        - supply equality for every person or resource
        - demand equality for every project or request
      incompatible_source_features:
        - binary one-to-one assignment
        - eligibility-only matching without continuous hours
        - staff shift roster with one assignment per employee
        - vehicle routes, arcs, paths, time windows, or subtours
        - optional unmet demand or over-coverage
        - supply as unused capacity rather than fully allocated hours
        - project demand as lower-bound coverage rather than exact required hours
    required_parameter_presentation:
      - list every person or resource and its available hours
      - list every project or request and its required hours
      - state total available hours equals total required hours
      - list cost per assigned hour for every person-project pair
      - list maximum contribution hours for every person-project pair
      - state x[i,j] is continuous nonnegative assigned hours
      - state every person's available hours must be fully allocated with equality
      - state every project's required hours must be exactly satisfied with equality
      - state every listed contribution upper bound must be enforced
    forbidden_misframings:
      - Do not convert the model into binary one-to-one matching.
      - Do not say people may leave unused available hours.
      - Do not say project demand can be over-satisfied or optionally unmet.
      - Do not omit maximum contribution limits for any person-project pair.
      - Do not invent eligibility binaries, routes, time windows, or sequencing constraints.
      - Do not aggregate all supply or all demand into one total-only constraint.
      - Do not reveal or constrain the model to an internally generated feasible allocation certificate.
    modeling_notes:
      - Preserve the balanced transportation-style continuous allocation structure.
      - Use hours as divisible quantities, not yes/no assignments.
      - Internal feasible allocation certificates are generator-only audit aids and should not appear in natural-language problems.
