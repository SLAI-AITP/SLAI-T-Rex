      - Do not omit fixed run costs.
      - Do not turn min/max production linking into ordinary capacity without the run decision.
      - Do not add transportation lanes, route choices, or customer assignment variables.
    modeling_notes:
      - Demand is aggregate by month and must be met or exceeded.
      - A factory can produce positive units in a month only if its RunDecision is 1.
      - If a factory is running, production must be at least the minimum and at most the maximum output.
      - The objective is cost minimization: fixed run cost plus variable production cost.
      - There is no inventory balance between months in this source model.
