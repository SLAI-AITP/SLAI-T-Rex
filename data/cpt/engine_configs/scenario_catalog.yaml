      - list every transfer-required node and the lines passing through it
      - state x[l] is binary line activation and f[l] is continuous service frequency
      - state s[c] is continuous unmet demand and is penalized in the objective
      - state the fleet budget is total vehicle-hours, not a count of vehicles assigned to routes
    forbidden_misframings:
      - Do not describe this as vehicle routing.
      - Do not introduce customer visit order, subtour elimination, or time-window constraints.
      - Do not invent z[i,j,l] arc-use variables or line-continuity constraints.
      - Do not convert frequency f[l] into a binary decision or an integer vehicle count.
      - Do not omit the OD-to-line service eligibility table.
      - Do not make transfer coverage optional; r[n] is a fixed input requirement.
    modeling_notes:
      - Preserve the line activation and continuous frequency structure.
      - Keep OD demand coverage, frequency linking, fleet vehicle-hours, and transfer-node coverage as separate constraint families.
      - The scenario may use buses, shuttles, ferries, or internal transport lines, but it should not become route sequencing.

  optmath_structure_based_assignment:
    task_family: assignment
    business_triggers:
      - after NMR spectra produced a new set of peaks for a protein sample
      - before validating a protein structure model with NOE evidence
      - after assignment costs were recalibrated from spectral matching scores
      - before freezing peak annotations for downstream structural analysis
      - after the NOE relation graph changed during expert review
      - before choosing a limited set of confident peak-amino-acid assignments
    variant_policy:
      use_only_generator_scenario_lenses: true
      use_only_generator_variation_axes:
        - narrative_angles
        - organization_profiles
        - planning_horizons
        - entity_naming_styles
    applicability:
      required_source_features:
        - peak set
        - amino acid set
        - binary x[peak, amino_acid] assignment variable
        - complete peak-amino-acid assignment cost matrix
        - exact required assignment count
        - NOE-related peak-pair list
        - amino-acid distance threshold or compatibility matrix
      incompatible_source_features:
        - workers, jobs, crews, equipment, gates, routes, or vehicles
        - capacity, workload, staffing, or shift coverage constraints
        - flow conservation or transportation lanes
        - optional assignment count instead of exact assignment count
        - incomplete cost or compatibility matrices
    required_parameter_presentation:
      - list all peaks and amino acids
      - list the complete peak-amino-acid assignment cost matrix
      - list the exact required assignment count
      - list all NOE-related peak pairs
      - list the amino-acid compatibility matrix or distance matrix with the threshold
      - state x[peak, amino_acid] is binary
      - state each peak and each amino acid can be used at most once
    forbidden_misframings:
      - Do not describe this as staffing, equipment allocation, gate assignment, routing, or project scheduling.
      - Do not invent compatibility or distance values not present in the source tables.
      - Do not omit the exact total assignment count.
      - Do not convert NOE compatibility constraints into capacities or workload rules.
      - Do not use placeholders such as perm? or replace_with.
    modeling_notes:
      - Preserve the NMR spectroscopy interpretation.
      - The objective minimizes assignment cost; it is not a profit maximization problem.
      - NOE-related peak pairs restrict which amino-acid pairs may be assigned together.
