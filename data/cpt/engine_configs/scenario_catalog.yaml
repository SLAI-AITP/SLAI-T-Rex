  optmath_supplychain:
    task_family: supply_chain
    business_triggers:
      - after lane capacity changed on a sparse transportation network
      - before fixed lane activation budgets are approved
      - during a supply-demand balancing review
      - after a disruption removed some candidate lanes from consideration
      - before committing a directed lane activation plan
      - after supplier availability and customer demand were reconciled
    applicability:
      required_source_features:
        - node set with supplier, customer, and optional transshipment roles
        - sparse declared directed arc set
        - binary arc activation variable y[i,j]
        - nonnegative continuous arc flow variable x[i,j]
        - arc capacity table
        - fixed arc activation cost table
        - unit arc flow cost table
        - node supply table
        - node demand table
        - node balance as inflow minus outflow equals demand minus supply
      incompatible_source_features:
        - node facility opening variables
        - warehouse inventory variables
        - time periods
        - storage carryover
        - vehicle route sequencing
        - customer visit-once constraints
        - arcs outside the declared sparse arc set
        - optional unmet demand
    required_parameter_presentation:
      - list all nodes and label each as supplier, customer, or transshipment
      - list supply and demand for every node, including zeros
      - list only declared directed arcs; do not describe the network as complete
      - for every declared arc, list capacity, fixed activation cost, and unit flow cost
      - state y[i,j] is binary arc activation and x[i,j] is nonnegative continuous flow
      - state capacity linking as x[i,j] <= capacity[i,j] * y[i,j]
      - state node balance as inflow minus outflow equals demand minus supply
      - state there are no inventory, storage, time-period, or node-opening decisions
    forbidden_misframings:
      - Do not add node facility opening variables or fixed node-opening costs.
      - Do not add inventory, storage, or time-period carryover.
      - Do not create arcs outside the declared sparse directed arc set.
      - Do not imply the network is a complete directed graph.
      - Do not reverse the flow-balance sign convention.
      - Do not omit fixed arc activation costs.
      - Do not turn the problem into vehicle routing or route sequencing.
    modeling_notes:
      - Preserve fixed-charge network design: binary arc activation plus continuous arc flow.
      - Preserve the sparse declared arc set exactly.
      - Preserve flow balance at supplier, customer, and transshipment nodes.
      - Treat the latent feasible flow, if present, only as a feasibility certificate, not as a required solution.
    scenarios:
      - scenario_id: supplychain_three_echelon_distribution
        industry: supply chain planning
        background: a manufacturer activates directed shipping lanes and chooses flows to move product from suppliers to customer nodes
        business_triggers:
          - before a directed lane activation plan is approved
          - after supplier availability and customer demand were reconciled
        entities: [nodes, directed lanes, suppliers, customers, arc capacities, fixed lane costs, unit flow costs]
      - scenario_id: supplychain_resilient_sourcing
        industry: procurement logistics
        background: a supply chain team selects reliable shipping lanes and routes flow through a capacitated network
        business_triggers:
          - after a disruption removed some candidate lanes from consideration
          - during a resilience review of lane activation choices
        entities: [supplier nodes, customer nodes, transshipment nodes, directed arcs, capacities, fixed activation costs, unit costs]
      - scenario_id: supplychain_relief_lane_activation
        industry: emergency logistics
        background: a relief agency activates transportation lanes to move supplies from staging nodes to demand nodes after a disruption
        business_triggers:
          - before approving an emergency shipment plan
          - after relief demand was updated at affected nodes
        entities: [staging nodes, affected demand nodes, directed lanes, arc capacities, activation costs, flow costs]
      - scenario_id: supplychain_spare_parts_network
        industry: service parts distribution
        background: a parts network planner chooses which directed lanes to activate and how much product to ship across them
        business_triggers:
          - after spare-parts demand shifted across service nodes
          - before fixed lane activation budgets are approved
        entities: [supply nodes, service demand nodes, transshipment nodes, arc capacities, fixed lane costs, unit flow costs]
      - scenario_id: supplychain_food_distribution_lanes
        industry: food logistics
        background: a distributor selects refrigerated shipping lanes and flow quantities across a directed supply network
        business_triggers:
          - after refrigerated lane capacity changed
          - before weekly food distribution lanes are committed
        entities: [food supply nodes, demand nodes, directed lanes, capacities, fixed activation costs, unit transport costs]
      - scenario_id: supplychain_pharma_lane_design
