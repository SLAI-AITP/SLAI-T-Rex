          description: an integrated manufacturer with product plants and regional distribution centers
        - profile_id: healthcare_network_supply_office
          description: a healthcare network supply office coordinating regional hubs
        - profile_id: relief_agency_logistics_cell
          description: a relief agency logistics cell planning warehouses and affected zones
      planning_horizons:
        - horizon_id: quarterly_network_review
          description: a quarterly network design review
