  optmath_aircraftlanding:
    task_family: scheduling
    business_triggers:
      - before freezing the arrival landing sequence
      - after a weather disruption compressed the arrival bank
      - during runway arrival metering
      - after controllers updated safety separation requirements
    applicability:
      required_source_features:
        - aircraft set
        - continuous landing time variable for every aircraft
        - binary pairwise order variable for every ordered aircraft pair
        - earliest, target, and latest landing time for every aircraft
        - early and late penalty per minute for every aircraft
        - required separation time for every ordered aircraft pair
      incompatible_source_features:
        - aircraft type availability
        - route demand or passenger capacity
        - fleet assignment or tail routing
        - gate assignment
        - time-expanded aircraft balance
        - route operating cost matrix
    required_parameter_presentation:
      - list aircraft
      - list earliest, target, and latest landing time for every aircraft
      - list early and late penalty per minute for every aircraft
      - list ordered-pair separation times
      - state binary order variables decide landing sequence
      - state the objective minimizes total early and late landing penalties
      - prefer compact_aircraft_landing_tables when listing numeric data
      - do not list big-M as a business input
    forbidden_misframings:
      - Do not describe this as aircraft fleet assignment.
      - Do not introduce route demand, aircraft type availability, or seat capacity.
      - Do not introduce tail routing or time-expanded aircraft balance.
      - Do not omit pairwise separation times.
      - Do not replace early/late penalty minimization with makespan minimization.
    modeling_notes:
      - Preserve pairwise order binaries.
      - Separation constraints are conditional on the selected landing order.
      - Early and late variables measure deviation from target landing time.
      - The model schedules landing times, not aircraft types or routes.
    scenario_lenses:
      - lens_id: runway_arrival_sequence
        industry: airport operations
        context: sequence arriving aircraft on a runway while respecting separation and landing windows
        entities: [aircraft, landing windows, target times, separation times, early and late penalties]
