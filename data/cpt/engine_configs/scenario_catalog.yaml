  optmath_portfolio:
    task_family: portfolio
    variant_policy:
      use_only_generator_scenario_lenses: true
      use_only_generator_variation_axes:
        - narrative_angles
        - organization_profiles
        - planning_horizons
        - entity_naming_styles
    business_triggers:
      - after covariance forecasts were refreshed
      - before an investment committee locks the target-return policy
      - during a risk-budget review
      - after expected-return estimates changed
      - before a reserve allocation is rebalanced
    applicability:
      required_source_features:
        - asset set
        - continuous portfolio weight variables
        - expected return vector
        - covariance matrix
        - minimum target return
        - full-investment budget equality
        - lower and upper weight bounds
        - convex quadratic variance objective
      incompatible_source_features:
        - binary asset selection
        - cardinality limits
        - transaction costs
        - minimum lot sizes
        - buy/sell rebalancing variables
        - route, flow, facility, or scheduling constraints
    required_parameter_presentation:
      - list all assets
      - list expected return for every asset
      - list the covariance matrix or a compact symmetric covariance table
      - list the minimum target return
      - state the portfolio weights must sum to one
      - state every weight is continuous and bounded by the stated lower and upper bounds
      - state the objective is to minimize covariance-based portfolio variance
      - state expected return is a constraint, not the maximization objective
    forbidden_misframings:
      - Do not introduce binary asset-selection, cardinality, transaction-cost, or minimum-lot variables.
      - Do not maximize expected return instead of minimizing variance.
      - Do not replace covariance terms with independent linear risk scores.
      - Do not omit off-diagonal covariance terms.
      - Do not describe the model as a knapsack, project-selection, or facility-location problem.
    modeling_notes:
      - Preserve continuous asset weights only.
      - Preserve the full covariance quadratic objective.
      - Preserve the full-investment equality and target-return inequality.
      - Preserve all weight lower and upper bounds.
    scenario_lenses:
      - lens_id: investment_committee_asset_mix
        industry: investment management
        context: choose continuous allocation weights across asset sleeves while controlling covariance-driven variance
        entities: [asset sleeves, expected returns, covariance matrix, target return, weight bounds]
