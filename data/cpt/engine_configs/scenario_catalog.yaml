        entities: [jobs, ordered machines, processing times, sequence positions, makespan]
      - scenario_id: flowshop_lab_sample_processing
        industry: laboratory operations
        background: a lab sequences sample batches through preparation and analysis stations
        business_triggers:
          - before a batch release schedule is frozen
          - during a cycle-time reduction review
        entities: [batches, ordered stations, processing times, sequence positions, makespan]
      - scenario_id: flowshop_printing_finishing_line
        industry: commercial printing
        background: a print shop sequences customer jobs through printing and finishing stages
        business_triggers:
          - during a same-day sequencing recovery meeting
          - after a downstream finishing station became capacity-critical
        entities: [print jobs, ordered machines, stage processing times, sequence positions, makespan]
      - scenario_id: flowshop_medical_device_sterilization
        industry: medical device manufacturing
        background: a device plant schedules batches through assembly and sterilization resources
        business_triggers:
          - before a batch release schedule is frozen
          - after a sterilization stage became capacity-critical
        entities: [batches, ordered work centers, processing times, sequence positions, makespan]
      - scenario_id: flowshop_food_packaging_batches
        industry: food packaging
        background: a packaging line sequences product batches through filling and labeling stations
        business_triggers:
