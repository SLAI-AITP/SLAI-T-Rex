  optmath_netthru:
    task_family: network_flow
    business_triggers:
      - after node throughput limits were revised
      - before approving a minimum-cost network dispatch
      - during a capacity-constrained transfer review
      - after link capacity limits changed
      - during disruption recovery planning
    applicability:
      required_source_features:
        - node set
        - sparse directed link set
        - supply and demand at every node
        - total supply equals total demand
        - continuous nonnegative shipment variable on each listed directed link
        - per-unit cost on each directed link
        - hard capacity on each directed link
        - throughput capacity at every node
        - node flow balance constraints
      incompatible_source_features:
        - binary link activation
        - fixed lane opening costs
        - maximum-flow source-sink objective
        - vehicle routes
        - time windows
        - subtour constraints
        - path selection variables
        - optional unmet demand
    required_parameter_presentation:
      - list nodes and sparse directed links only
      - list supply and demand for every node, including zero values
      - state total supply equals total demand
      - list per-unit cost and capacity for every directed link
      - list throughput capacity for every node
      - state node throughput is supply plus inbound flow
      - state flow balance as supply plus inbound shipment equals demand plus outbound shipment
      - state all shipment variables are continuous and nonnegative
    forbidden_misframings:
      - Do not describe this as maximum throughput.
      - Do not add binary link activation or fixed lane-opening costs.
      - Do not convert the sparse directed network into a complete graph.
      - Do not describe this as vehicle routing or route sequencing.
      - Do not add unmet-demand slack or optional demand.
      - Do not omit node throughput capacities.
      - Do not reveal or constrain the model to an internally generated feasible flow certificate.
    modeling_notes:
      - This is a minimum-cost flow LP with both link capacities and node throughput capacities.
      - Node throughput capacity applies to supply plus inbound flow at that node.
      - The listed directed links are the only valid shipment lanes.
      - Intermediate nodes may have zero supply and zero demand but still obey flow balance and throughput limits.
      - Internal feasible flow certificates are generator-only audit aids and should not appear in natural-language problems.
    scenario_lenses:
      industry_lenses:
        - freight transfer network
        - utility or water transfer operations
        - telecom traffic routing
        - emergency logistics corridors
        - hospital supply redistribution
      narrative_angles:
        - minimum-cost dispatch under lane and node capacity limits
        - audit-ready node-balance plan
        - disruption recovery through sparse approved links
        - throughput-constrained transfer plan
    scenarios:
      - scenario_id: netthru_freight_min_cost_transfer
        industry: freight operations
        background: a freight control team routes required shipments at minimum cost through approved directed lanes and terminal throughput limits
