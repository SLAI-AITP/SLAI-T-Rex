  optmath_flowshop_2:
    task_family: scheduling
    business_triggers:
      - after a production-line bottleneck review
      - before a batch release schedule is frozen
      - during a cycle-time reduction review
      - after a downstream station became capacity-critical
      - before a shift supervisor publishes the line sequence
      - during a same-day sequencing recovery meeting
    applicability:
      required_source_features:
        - jobs or batches that all visit every machine
        - one ordered machine-stage list shared by every job
        - one shared sequence position set with the same size as the job set
        - binary assignment variable x[j,k] linking jobs to shared sequence positions
        - start-time variable t[k,m] indexed by shared sequence position and machine
        - explicit Makespan variable
        - job-machine processing-time table p[j,m]
        - makespan completion bound based on final position completion on the final machine
      incompatible_source_features:
        - machine-specific job sequences
        - job-specific machine routes
        - due dates, release dates, tardiness penalties, or weighted completion costs
        - aircraft landing slots or route schedules
        - staff shift assignment
        - transportation lanes or network flows
        - alternative machine choices
    required_parameter_presentation:
      - list all jobs or batches
      - list shared sequence positions, one for each job
      - list machines in fixed processing order
      - list processing time for every job-machine pair
      - state x[j,k] assigns job j to shared sequence position k and is not indexed by machine
      - state every machine uses the same sequence of shared positions
      - state t[k,m] is the start time of the job in position k on machine m
      - state the objective minimizes an explicit Makespan variable
      - state Makespan is bounded below by completion time of the final shared position on the final machine
      - state final-machine processing times belong in the Makespan completion bound, not in an assignment-cost objective
    forbidden_misframings:
      - Do not call sequence positions calendar time slots, landing slots, or independent machine slots.
      - Do not describe each machine as choosing its own sequence.
      - Do not introduce due dates, release dates, tardiness penalties, delay weights, or weighted completion costs.
      - Do not use job-specific machine routes; that would be a job shop, not this flow shop.
      - Do not add machine-choice, staffing, routing, transportation, or service-coverage constraints.
      - Do not omit the explicit Makespan variable and final-position completion bound.
      - Do not interpret the objective as total processing cost, total completion time, or weighted completion time.
    modeling_notes:
      - Preserve the common permutation sequence across all machines.
      - Preserve sequence positions as abstract ordering positions, not calendar periods.
      - Preserve the explicit Makespan objective and the final-position completion bound.
      - Final-position processing-time coefficients are processing times on the final machine, not business costs.
    scenarios:
      - scenario_id: flowshop_two_stage_production
        industry: manufacturing scheduling
        background: a plant chooses one common job sequence through serial production stations to minimize final completion time
        business_triggers:
          - after a production-line bottleneck review
