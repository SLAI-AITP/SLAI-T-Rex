        industry: air traffic recovery
        context: rebuild a compressed arrival sequence after weather disruption
        entities: [flights, target times, windows, separation buffers, deviation penalties]
      - lens_id: hub_arrival_metering
        industry: airline hub operations
        context: meter a bank of inbound flights into safe landing times
        entities: [inbound flights, landing times, separation matrix, schedule penalties]
      - lens_id: emergency_priority_landing
        industry: airport emergency operations
        context: schedule a set of arrivals with strict windows and separation requirements
        entities: [arrivals, landing windows, target times, safety separation, delay penalties]
    scenarios:
