      - before a service-level exception meeting
    applicability:
      required_source_features:
        - ordered period set
        - demand by period
        - fixed ordering cost by period
        - unit order cost by period
        - inventory holding cost by period
        - backlog penalty by period
        - continuous order quantity variable by period
        - binary setup variable by period
        - continuous ending inventory variable by period
        - continuous backlog state variable by period
        - net inventory balance with backlog carryover
        - total-demand big-M setup linking
        - zero final inventory and zero final backlog
      incompatible_source_features:
        - production capacity constraints
        - per-period order capacity limits
        - workforce or machine capacity tables
        - lost-sales variables
        - service-level fill-rate constraints
        - stochastic demand scenarios
    required_parameter_presentation:
      - list periods in chronological order
      - list demand, fixed ordering cost, unit order cost, holding cost, and backlog penalty for every period
      - state initial inventory and initial backlog are both zero constants
      - state final inventory and final backlog must both be zero
      - state net inventory is ending inventory minus backlog
      - state OrderedAmount[t] is linked to OrderIsPlaced[t] by total-demand big-M
      - state there is no production capacity or per-period order capacity constraint
    forbidden_misframings:
      - Do not add production capacity.
      - Do not describe backlog as lost sales.
      - Do not omit the binary setup variable or fixed ordering cost.
