  optmath_mcnd:
    task_family: network_design
    business_triggers:
      - before a network capacity investment plan is approved
      - after multi-commodity demand was revised
      - during a fixed-cost network design review
      - after candidate directed arcs were updated
      - before committing capacity modules on expensive links
    applicability:
      required_source_features:
        - node set
        - commodity set
        - declared directed arc set
        - commodity origin, destination, and demand table
        - continuous x[k,i,j] commodity-flow fraction variable
        - nonnegative integer y[i,j] arc facility-count variable
        - arc facility capacity table
        - fixed facility installation cost by arc
        - commodity-arc routing cost table
        - commodity flow conservation constraints
        - demand-weighted arc capacity linking
      incompatible_source_features:
        - binary arc activation only
        - node facility opening
        - vehicle routes or subtour constraints
        - time windows
        - inventory carryover or backlog
        - customer assignment variables
        - single-commodity aggregate flow only
    required_parameter_presentation:
      - list all nodes, commodities, and declared directed arcs
      - for every commodity, list origin, destination, and demand
      - for every declared arc, list facility capacity and fixed facility installation cost
      - for every commodity-arc pair, list unit routing cost
      - state x[k,i,j] is a continuous flow fraction between 0 and 1
      - state y[i,j] is a nonnegative integer number of installed capacity facilities, not binary
      - state flow conservation sends one unit of each commodity from its origin to destination
      - state arc capacity is demand-weighted commodity flow bounded by installed facility capacity
    forbidden_misframings:
      - Do not make y[i,j] binary.
      - Do not collapse commodities into one aggregate commodity.
      - Do not replace arc facility counts with node facility openings.
      - Do not add vehicles, tours, time windows, inventory, or customer assignment.
      - Do not omit commodity-specific routing costs.
    modeling_notes:
      - The flow variable x[k,i,j] is a fraction of commodity k's demand routed over arc i->j.
      - Capacity constraints use demand-weighted flow, not raw x fractions alone.
      - y[i,j] can be greater than one because multiple capacity facilities may be installed on an arc.
    scenario_lenses:
      - lens_id: freight_capacity_module_design
        industry: freight transportation
        context: install capacity modules on directed freight lanes and route several commodity flows
        entities: [nodes, directed lanes, commodities, demands, facility counts, routing costs]
      - lens_id: telecom_bandwidth_module_design
        industry: telecommunications
        context: install bandwidth modules on network links for multiple traffic classes
        entities: [network nodes, links, traffic classes, module capacities, routing costs]
      - lens_id: energy_material_corridor_design
        industry: energy logistics
        context: add corridor capacity for several material streams between origin and destination sites
        entities: [sites, corridors, material streams, capacity modules, fixed costs]
      - lens_id: relief_multicommodity_corridor_plan
        industry: humanitarian logistics
        context: reserve directed corridor capacity for multiple relief commodity classes
        entities: [hubs, directed corridors, relief commodities, capacity modules, demands]
      - lens_id: cloud_backbone_capacity_plan
        industry: cloud infrastructure
        context: install backbone capacity units and route several traffic classes through the network
        entities: [network nodes, backbone arcs, traffic classes, capacity units, routing costs]
    scenarios:
      - scenario_id: mcnd_multicommodity_freight_network
        industry: freight transportation
        background: a carrier installs capacity modules on directed freight lanes and routes several commodity flows
        business_triggers:
          - before a network capacity investment plan is approved
          - after multi-commodity demand was revised
        entities: [commodities, nodes, directed arcs, integer capacity modules, routing costs]
