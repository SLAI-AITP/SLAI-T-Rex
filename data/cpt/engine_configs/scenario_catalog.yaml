  optmath_singlelevelsmallbucket:
    task_family: lot_sizing
    business_triggers:
      - before freezing the short-horizon production schedule
      - after a customer order surge changed item-period demand
      - before committing machine setups for the next planning window
      - after startup losses became a bottleneck in a small-bucket schedule
      - before deciding whether to carry inventory or accept backlog
      - during a review of multi-machine changeover plans
    applicability:
      required_source_features:
        - item set, machine set, and time-period set
        - continuous Amount[i,m,t] production quantity
        - binary Production[i,m,t] item-machine-period production state
        - binary Startup[i,m,t] startup event
        - continuous Stock[i,t] inventory
        - continuous Backlog[i,t] backlog
        - full item-period demand matrix
        - item holding and backlog cost table
        - machine capacity and startup time table
        - global setup cost and startup cost
      incompatible_source_features:
        - per-unit production cost in the objective
        - routing or sequence variables between customers
        - facility opening decisions
        - vehicle routes or subtour constraints
        - one aggregate production variable per item without machines and periods
        - independent period slack without inventory/backlog carryover
    required_parameter_presentation:
      - list all items, machines, and periods
      - list the full item-period demand matrix
      - list each item's holding cost and backlog cost
      - list each machine's capacity and startup time
      - state the setup cost and startup cost as global scalar costs
      - explicitly state there is no per-unit production cost term in the source objective
      - state each machine can produce at most one item per period
      - state inventory and backlog carry forward through net inventory balance
    forbidden_misframings:
      - Do not describe this as a vehicle routing, facility location, or project staffing problem.
      - Do not invent a unit production cost or material cost term.
      - Do not replace startup transition constraints with a single setup-count variable.
      - Do not collapse machine-specific capacity and startup time into one aggregate capacity.
      - Do not omit backlog if the source includes Backlog variables.
    modeling_notes:
      - Preserve the small-bucket item-machine-period structure.
      - The source objective has setup, startup, holding, and backlog costs only.
      - The natural-language problem should be concise and table-driven; do not add unstated production economics.
    scenarios:
      - scenario_id: smallbucket_food_batch_schedule
        industry: food manufacturing
        background: a plant schedules short production runs across parallel lines before a weekly order freeze
        entities: [food products, production lines, shifts, demand matrix, setup cost, startup cost, inventory, backlog]
