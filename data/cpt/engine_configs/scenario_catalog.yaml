        background: a food plant plans product batches over shifts while using limited processing hours
        entities: [food products, shifts, batch quantities, setup decisions, inventory, processing hours]
      - scenario_id: clsp_spare_component_release_plan
        industry: industrial equipment
        background: a component manufacturer schedules spare-component lots to meet cumulative service demand under period capacity
        entities: [components, periods, production lots, setup decisions, inventory, fixed period capacity]

  optmath_carselection:
    task_family: assignment
    business_triggers:
      - after a shared fleet reservation window opened
      - before allocating limited vehicles to approved requesters
      - during a same-day mobility allocation review
      - after eligibility rules were updated by operations
      - before confirming participant vehicle access
    variant_policy:
      use_only_generator_scenario_lenses: true
      use_only_generator_variation_axes:
        - narrative_angles
        - organization_profiles
        - planning_horizons
        - entity_naming_styles
    applicability:
      required_source_features:
        - participant set
        - car set
        - binary participant-car eligibility matrix
        - binary Assignments[p,c] variables
        - assignment-only-if-eligible constraints
        - participant at-most-one-car constraints
        - car at-most-one-participant constraints
        - objective maximizing number of assigned eligible pairs
      incompatible_source_features:
        - assignment costs or scores
        - transportation flow quantities
        - vehicle routes
        - time windows
        - technicians, service jobs, worker-job matching, staffing, or shift scheduling
        - required full assignment of every participant
        - multi-period scheduling
    required_parameter_presentation:
      - list every participant and every car
      - list the complete participant-car eligibility matrix or eligible-car lists
      - state Assignments[p,c] is binary
      - state assignments are allowed only for eligible participant-car pairs
      - state each participant can receive at most one car
      - state each car can be assigned to at most one participant
      - state the objective maximizes the number of assigned eligible pairs
    forbidden_misframings:
      - Do not introduce assignment costs, scores, travel distances, or revenues.
      - Do not require every participant or every car to be assigned.
      - Do not turn this into vehicle routing, transportation, or fleet scheduling.
      - Do not add time windows, routes, or service sequences.
      - Do not describe this as technician-to-job, worker-to-shift, staffing, or service-job matching.
    modeling_notes:
      - This is maximum-cardinality bipartite matching with eligibility constraints.
      - Both sides use at-most-one constraints, not exact assignment.
    scenario_lenses:
