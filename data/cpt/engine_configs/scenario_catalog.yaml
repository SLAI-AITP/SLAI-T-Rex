  optmath_revenue:
    task_family: revenue_management
    business_triggers:
      - after capacity availability was confirmed
      - before opening package sales for a planning window
      - during a limited-capacity offer allocation review
      - after demand forecasts were updated
      - before approving accepted booking quantities
    applicability:
      required_source_features:
        - package set
        - resource or flight-leg set
        - package revenue vector
        - package demand upper-bound vector
        - resource capacity vector
        - package-resource usage matrix
        - nonnegative integer Sell[p] variables
        - objective maximizing package revenue
      incompatible_source_features:
        - dynamic pricing
        - stochastic arrivals
        - booking periods
