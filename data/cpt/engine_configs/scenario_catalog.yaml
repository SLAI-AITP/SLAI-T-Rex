  optmath_cflp:
    task_family: facility_location
    business_triggers:
      - before a facility opening recommendation is finalized
      - after regional demand forecasts were updated
      - during a network capacity review
      - before committing fixed operating budgets
    applicability:
      required_source_features:
        - candidate facility set
        - customer set
        - binary facility opening variable
        - continuous nonnegative customer-facility shipment variable
        - fixed opening cost for every facility
        - capacity for every facility
        - demand for every customer
        - complete customer-facility transport cost matrix
        - customer demand equality
        - open-before-ship linking
        - capacity linked to opening decision
      incompatible_source_features:
        - vehicle routes
        - time windows
        - subtour constraints
        - inventory carryover
        - multi-period production
        - pure transportation without fixed opening decisions
    required_parameter_presentation:
      - list candidate facilities with fixed opening cost and capacity
      - list customers and demand for every customer
      - list complete customer-facility transportation cost matrix
      - state FacilityOpen[j] is binary
      - state ShippedAmount[i,j] is continuous and nonnegative
      - state customer demand is exactly satisfied
      - state shipments can occur only from open facilities
      - state facility capacity applies only when the facility is opened
      - prefer compact_cflp_tables when listing numeric data
    forbidden_misframings:
      - Do not describe this as pure transportation without facility-opening choices.
      - Do not omit fixed facility opening costs.
      - Do not introduce vehicles, tours, subtours, service times, or time windows.
      - Do not introduce inventory or production periods.
      - Do not relax exact customer demand into optional service.
    modeling_notes:
