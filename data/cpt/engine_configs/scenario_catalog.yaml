  optmath_cell_tower:
    task_family: facility_location
    business_triggers:
      - after coverage complaints increased in underserved zones
      - before approving a tower buildout budget
      - during a rural broadband expansion planning round
      - after a disaster-resilience communications review
      - before selecting the next wave of candidate radio sites
    applicability:
      required_source_features:
        - candidate tower set
        - region set
        - tower setup cost vector
        - region population vector
        - binary tower-region coverage matrix
        - tower-building budget
        - binary Build[t] variables
        - binary Covered[r] variables
        - objective maximizing covered population
      incompatible_source_features:
        - continuous shipments
        - customer assignment quantities
        - facility capacity limits
        - exact demand satisfaction
        - vehicle routes
        - time windows
        - requirement to cover every region
    required_parameter_presentation:
      - list every candidate tower with setup cost
      - list every region with population
      - list the complete tower-region coverage matrix or covered-region lists
      - state the tower-building budget
      - state Build[t] and Covered[r] are binary
      - state a region can be marked covered only if at least one selected tower covers it
      - state total selected tower setup cost must not exceed the budget
      - state the objective maximizes total covered population
    forbidden_misframings:
      - Do not require all regions to be covered.
      - Do not describe shipments, demand fulfillment, facility capacity, vehicles, or routes.
      - Do not change the model into capacitated facility location or transportation.
      - Do not change covered-population maximization into cost minimization.
    modeling_notes:
      - This is a budgeted maximum-coverage model, not a service-assignment model.
      - Covered[r] is optional and population-weighted.
    scenarios:
