  optmath_multisetcover:
    task_family: covering
    business_triggers:
      - after minimum redundancy requirements were updated
      - during a resilience stress-test review
      - before a budget committee approves coverage spending
      - after a service-level risk alert identified under-covered elements
      - during a compliance audit of redundant safeguards
      - before a weekly coverage plan is locked
    applicability:
      required_source_features:
        - candidate set list with selection cost for each set
        - element list with required coverage count for each element
        - binary selected-set decision variable
        - complete set-to-element coverage membership matrix
        - coverage lower-bound constraints requiring at least r[e] selected covering sets
      incompatible_source_features:
        - continuous coverage quantities
        - exact-cover equality requirements
        - ordinary single-cover requirements when r[e] can exceed one
        - routing paths, vehicles, arcs, or time windows
        - assignment of people to shifts or tasks
        - flow balance or capacity constraints
        - budget upper bound unless explicitly present
    required_parameter_presentation:
      - list every candidate set and its selection cost
      - list every element and its required coverage count
      - list the complete coverage membership for every candidate set
      - state Selected[i] is binary
      - state each element must be covered by at least its required coverage count
      - state coverage requirements are lower bounds, not exact equality
      - state this is multicover, so requirements may be greater than one
    forbidden_misframings:
      - Do not omit any candidate set, element, cost, coverage requirement, or coverage membership.
      - Do not invent coverage memberships that are not listed.
      - Do not downgrade multicover to ordinary one-cover set cover.
      - Do not replace at-least coverage constraints with exact-cover equality constraints.
      - Do not introduce routes, flows, assignments, schedules, capacities, or budget limits.
      - Do not make selection variables continuous counts.
    modeling_notes:
      - Preserve the complete coverage matrix; partial coverage tables are not acceptable.
      - Use binary select/do-not-select decisions for candidate sets.
      - Treat coverage requirements as lower bounds.
      - Minimize total cost of selected sets, not simply the number of selected sets unless costs are all one.
