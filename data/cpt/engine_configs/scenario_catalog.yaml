  optmath_factory_planning_problem:
    task_family: production_planning
    business_triggers:
      - before a monthly production and sales plan is frozen
      - after machine maintenance reduced available hours
      - after product-level sales forecasts were revised
      - before final inventory commitments are approved
    applicability:
      required_source_features:
        - multiple planning periods
        - product-period production, sales, and ending inventory variables
        - machine-product processing-time table
        - period-machine available-hour capacity table
        - product-period sales upper-bound table
        - final inventory target by product
      incompatible_source_features:
        - single-period product mix without inventory carryover
        - public service coverage or program activity allocation
        - multi-site facility opening or network expansion
        - vehicle routes, subtours, or visit sequencing
        - workforce roster assignment
    required_parameter_presentation:
      - show the full product list and period list
      - use compact_factory_planning_tables when available
      - show profit per product
      - show holding cost per unit of ending inventory
      - show processing hours by machine and product
      - show available machine hours by period and machine
      - show sales upper bounds by period and product
      - show inventory upper bound and final inventory target
    forbidden_misframings:
      - Do not say there are no capacity constraints.
      - Do not say sales are unbounded.
      - Do not aggregate sales limits into one total demand per product.
      - Do not infer demand totals from the reference answer.
      - Do not frame this as public program allocation, service coverage, or network expansion.
      - Do not omit final inventory targets.
    modeling_notes:
      - Preserve the period-by-period inventory balance exactly.
      - State that initial inventory is zero unless the source says otherwise.
      - Machine capacity is measured in machine hours after maintenance, not budget dollars or staff headcount.
      - Sales upper bounds are product-period market caps, not aggregate demand totals.
      - The final inventory target is an equality in the last period for every product.
    variant_policy:
      use_only_generator_scenario_lenses: true
      use_only_generator_variation_axes:
        - narrative_angles
        - organization_profiles
        - planning_horizons
        - entity_naming_styles
    scenario_lenses:
      - lens_id: factory_monthly_production_inventory
        industry: manufacturing
        context: plan monthly production, sales, and ending inventory for product lines using constrained machines
        entities: [products, periods, machines, sales limits, inventory targets]
      - lens_id: packaging_line_production_inventory
        industry: consumer goods manufacturing
        context: schedule package production over periods while meeting sales caps and final stock targets
        entities: [SKUs, production periods, filling lines, sales caps, ending inventory]
      - lens_id: specialty_materials_production_plan
        industry: specialty materials manufacturing
        context: plan material-grade production with machine-hour limits and required final inventory
        entities: [material grades, machines, periods, sales limits, final inventory]
      - lens_id: electronics_assembly_capacity_plan
        industry: electronics manufacturing
        context: choose assembly quantities, sales quantities, and ending stock across periods under machine-hour limits
        entities: [assemblies, work centers, periods, sales forecasts, inventory targets]
      - lens_id: industrial_spares_sop_plan
        industry: industrial spare parts manufacturing
        context: balance spare-part production, sales caps, and required final stock over a finite S&OP horizon
        entities: [spare parts, S&OP periods, machine centers, sales caps, final stock targets]
      - lens_id: medical_device_batch_plan
        industry: medical device manufacturing
        context: plan device batch output and sales over periods while preserving end-horizon inventory commitments
        entities: [device SKUs, periods, work centers, sales limits, safety-stock targets]
    variation_axes:
      narrative_angles:
        - angle_id: maintenance_capacity_reset
          description: frame the instance as a production-plan reset after maintenance changed machine-hour availability
          business_triggers: [after machine maintenance reduced available hours, before the revised capacity plan is approved]
        - angle_id: sales_forecast_caps
          description: frame the instance as an S&OP cycle where product-period sales forecasts cap what can be sold
          business_triggers: [after product-level sales forecasts were revised, before monthly sales commitments are locked]
        - angle_id: final_stock_commitment
          description: frame the instance as protecting required end-horizon stock for every product while maximizing net sales profit
          business_triggers: [before final inventory commitments are approved, during a safety-stock review]
        - angle_id: buildahead_under_bottlenecks
          description: frame the instance as deciding when to build ahead inventory under machine bottlenecks and holding costs
          business_triggers: [after a machine-hour bottleneck was identified, during a build-ahead planning review]
        - angle_id: constrained_sop_review
          description: frame the instance as a constrained sales-and-operations planning review with production, sales, and inventory variables
          business_triggers: [during a monthly S&OP review, before the production calendar is frozen]
      organization_profiles:
        - profile_id: industrial_plant_planning_team
          description: an industrial plant planning team coordinating product output and machine-hour capacity
        - profile_id: sop_planning_office
          description: an S&OP planning office balancing sales caps, production, and inventory targets
        - profile_id: manufacturing_recovery_cell
          description: a manufacturing recovery cell revising production after capacity changes
      planning_horizons:
        - horizon_id: six_period_monthly_plan
          description: a six-period monthly production, sales, and inventory horizon
        - horizon_id: rolling_sop_window
          description: a rolling S&OP window before commitments are locked
        - horizon_id: short_buildahead_window
          description: a short build-ahead window for constrained production
        - horizon_id: quarter_end_stock_commitment
          description: a quarter-end final-stock commitment horizon
      entity_naming_styles:
        - style_id: product_machine_period_labels
          description: use neutral labels such as product_0, machine grinder, and period 0
        - style_id: sku_workcenter_period_labels
          description: use SKU, work-center, and monthly-period labels while preserving all source indices
        - style_id: compact_table_labels
          description: use compact table labels and keep product, period, and machine names close to the source
    scenarios:
      - scenario_id: factory_planning_machine_capacity
        industry: manufacturing
        background: a factory creates a multi-period production, sales, and inventory plan under machine-hour capacity limits
        entities: [products, periods, machines, processing times, sales limits, inventory targets]
      - scenario_id: factory_planning_weekly_product_mix
        industry: industrial operations
        background: an operations manager plans product-period production and ending inventory before weekly sales commitments are locked
        entities: [products, periods, machine hours, sales limits, inventory holding costs, final inventory]
      - scenario_id: factory_planning_maintenance_constrained_capacity
        industry: discrete manufacturing
        background: a plant updates its production plan after scheduled maintenance changes available machine hours by period
        entities: [products, machines, maintenance-adjusted hours, production quantities, sales quantities, ending inventory]
      - scenario_id: factory_planning_sales_forecast_caps
        industry: industrial manufacturing
        background: a sales and operations planning team caps product-period sales using revised market forecasts
        entities: [products, periods, sales upper bounds, production quantities, inventory balances, profit margins]
      - scenario_id: factory_planning_final_stock_commitment
