generators:
  optmath_aircraftassignment:
    task_family: assignment
    business_triggers:
      - before publishing the daily fleet assignment plan
      - after route demand forecasts were updated
      - during an operating-cost reduction review
      - after aircraft availability changed
    applicability:
      required_source_features:
        - aircraft type set
        - route set
        - nonnegative integer aircraft-route allocation variables
        - aircraft type availability limits
        - route demand requirements
        - aircraft-route capacity contribution matrix
        - aircraft-route operating cost matrix
      incompatible_source_features:
        - aircraft tail routing continuity
        - time-expanded fleet balance
        - landing sequence or runway separation
        - passenger spill or recapture
        - binary one-aircraft-to-one-route matching
        - gate assignment or crew scheduling
    required_parameter_presentation:
      - list aircraft types and available count for every type
      - list routes and passenger demand for every route
      - list aircraft-route capacity contribution matrix
      - list aircraft-route operating cost matrix
      - state allocation variables are nonnegative integers
      - state each route's assigned capacity must meet or exceed demand
      - state each aircraft type cannot exceed its available count
      - prefer compact_aircraft_assignment_tables when listing numeric data
    forbidden_misframings:
      - Do not describe this as aircraft routing or tail rotation.
      - Do not introduce time-expanded aircraft balance.
      - Do not introduce passenger spill, recapture, or fare-class revenue variables.
      - Do not turn integer allocation counts into binary one-aircraft matching.
      - Do not omit aircraft-route capacity contribution coefficients.
    modeling_notes:
      - Preserve nonnegative integer allocation counts.
      - Route demand is satisfied through capacity contribution times allocation.
      - Availability is by aircraft type, not by individual tail number.
