version: v1.2.0

global:
  default_task_family: general_operations_research
  common_scenarios:
    - scenario_id: common_enterprise_resource_planning
      industry: enterprise operations
      background: an operations team allocates limited resources across competing activities
      entities: [activities, resources, capacities, operating costs]
      units: [units, hours, dollars]
    - scenario_id: common_public_service_planning
      industry: public service planning
      background: a public agency assigns limited capacity to meet service requirements
      entities: [service zones, resources, requirements, budgets]
      units: [service units, staff hours, dollars]
    - scenario_id: common_sustainability_planning
      industry: sustainability operations
      background: a sustainability program chooses an operating plan under budget and capacity limits
      entities: [projects, resources, emission limits, benefits]
      units: [tons, dollars, benefit points]
  modeling_notes:
    - Choose a realistic business setting that matches the source sets, coefficients, and constraints.
    - Do not change the mathematical structure while adding business context.
    - Preserve all numeric coefficients, indexed tables, bounds, and objective direction from the source.
  business_triggers:
    - during a weekly planning cycle
    - during a budget approval round
    - after a demand forecast revision
    - after a demand surge changed operating requirements
    - after a capacity shortage was identified
    - during seasonal replenishment planning
    - during disruption recovery planning
    - before a same-day dispatch cutoff
    - after supplier lead times changed
    - after a service-level risk alert
    - during a resilience stress-test review
    - before a contract award recommendation is finalized
    - after a facility outage reduced available capacity
    - before peak-season volume commitments are locked
    - during a sustainability or waste-reduction review
  applicability:
    required_source_features:
      - linear objective and constraints
      - numeric coefficients preserved from the source instance
      - all source sets, bounds, capacities, and indexed tables stated explicitly
    incompatible_source_features:
      - unstated constraints
      - unprovided external files
      - business rules not present in the source instance
      - time dynamics unless the source has periods or stages
  scenario_variation:
    # The catalog keeps a small number of human-authored base scenarios per generator,
    # then the engine expands them with task-family-specific industry lenses, narrative
    # angles, entity naming styles, and unit styles. This gives each generator 50+
    # traceable business wrappers without hand-maintaining thousands of YAML rows.
    enabled: true
    min_scenario_variants_per_generator: 50
    max_expanded_scenarios_per_generator: 240
  variation_axes:
    # Optional YAML overrides. The default large industry-lens library lives in
    # or_cpt_engine/backtranslation/scenario_variants.py; rows added here are
    # merged into that library without changing code.
    narrative_angles:
      - angle_id: audit_ready_operating_case
        description: frame the problem as an audit-ready operating case prepared for management review
        business_triggers:
          - before an internal operating review
          - after managers asked for an auditable optimization case
      - angle_id: customer_commitment_pressure
        description: frame the problem around meeting promised service commitments under limited resources
        business_triggers:
          - after customer commitments were updated
          - before service commitments are published
    organization_profiles:
      - profile_id: nonprofit_service_network
        description: a nonprofit service network balancing fairness, coverage, and limited funding
      - profile_id: regulated_utility_operator
        description: a regulated utility operator balancing reliability, cost, and operational constraints
    planning_horizons:
      - horizon_id: board_decision_packet
        description: a decision packet prepared for a board or steering committee
    entity_naming_styles:
      - style_id: stakeholder_friendly_labels
        description: use stakeholder-friendly names while still preserving all source indices in tables

task_families:
  assignment:
    business_triggers:
      - during a roster finalization meeting
      - after new compatibility scores were released
      - during a capacity-constrained allocation round
    applicability:
      required_source_features:
        - assignment variables linking agents to tasks
        - compatibility, cost, score, or eligibility coefficients
        - one-to-one, many-to-one, or capacity assignment limits
      incompatible_source_features:
        - vehicle routes
        - path conservation constraints
        - inventory balance across periods
    common_scenarios:
      - scenario_id: family_assignment_shift_or_asset_matching
        industry: workforce and asset operations
        background: a coordinator matches people or assets to tasks while respecting compatibility
        entities: [agents, tasks, compatibility scores, assignment limits]
        units: [assignments, score points]
      - scenario_id: family_assignment_marketplace_matching
        industry: digital marketplace operations
        background: a platform assigns requests to providers based on eligibility and capacity
        entities: [requests, providers, eligibility matrix, capacities]
        units: [matches, reward points]
    modeling_notes:
      - Use binary assignment variables unless the source explicitly gives fractional assignments.
      - State one-to-one, many-to-one, compatibility, and capacity rules separately.
    forbidden_misframings:
      - Do not turn assignment into routing unless arcs and paths are present.

  scheduling:
    business_triggers:
      - during a daily schedule recovery cycle
      - after urgent jobs changed the priority list
      - before a fixed production or service window opens
    applicability:
      required_source_features:
        - jobs, tasks, flights, or service activities
        - machines, crews, runways, slots, or other limited processing resources
        - processing times, start times, completion times, or sequencing decisions
      incompatible_source_features:
        - pure supply-demand transportation matrices
        - facility opening decisions
        - diet or nutrient tables
    common_scenarios:
      - scenario_id: family_scheduling_factory_jobs
        industry: manufacturing scheduling
        background: a plant schedules jobs on machines or production lines
        entities: [jobs, machines, processing times, due dates]
        units: [time periods, hours, lateness cost]
      - scenario_id: family_scheduling_service_slots
        industry: service operations
        background: a service provider schedules tasks into limited time slots
        entities: [tasks, crews, shifts, service windows]
        units: [hours, shifts, penalty points]
    modeling_notes:
      - Keep sequencing, start-time, completion-time, capacity, and precedence constraints distinct.
      - Use binary order or assignment variables when the source describes discrete job placement.

  packing:
    business_triggers:
      - before a truck loading cutoff
      - during a capital budget approval round
      - after container capacity became scarce
    applicability:
      required_source_features:
        - discrete items, parcels, projects, or boxes
        - item weights, sizes, costs, or values
        - one or more capacity or budget limits
      incompatible_source_features:
        - supply-demand flow balance
        - vehicle route sequencing
        - nutrient lower and upper bounds
    common_scenarios:
      - scenario_id: family_packing_freight_loading
        industry: logistics
        background: a logistics team selects or packs items under weight or volume limits
        entities: [items, containers, capacities, values]
        units: [kilograms, cubic meters, dollars]
      - scenario_id: family_packing_budget_selection
        industry: capital planning
        background: a manager chooses projects under a budget to maximize benefit
        entities: [projects, budgets, returns, resource limits]
        units: [dollars, benefit points]
    modeling_notes:
      - Use binary take-or-leave decisions for indivisible items.
      - State every item size, weight, cost, value, and capacity limit explicitly.

  cutting_stock:
    business_triggers:
      - after customer order sizes were finalized
      - during a waste-reduction planning review
      - before releasing a cutting plan to production
    applicability:
      required_source_features:
        - stock material sizes
        - required order sizes or demand quantities
        - cutting patterns, pattern counts, or waste measures
      incompatible_source_features:
        - customer routing
        - open-close facility decisions
        - nutrient-composition bounds
    common_scenarios:
      - scenario_id: family_cutting_stock_metal_rolls
        industry: metal fabrication
        background: a workshop cuts stock material into required order sizes while minimizing waste
        entities: [stock rolls, order lengths, cutting patterns, waste]
        units: [meters, pieces]
      - scenario_id: family_cutting_stock_packaging
        industry: packaging production
        background: a packaging plant cuts sheets into customer order formats
        entities: [sheet sizes, demand quantities, patterns, leftover material]
        units: [sheets, square meters]
    modeling_notes:
      - Preserve pattern counts, demand quantities, and stock capacities exactly.

  blending:
    business_triggers:
      - after quality specifications changed
      - during a raw-material purchasing review
      - before confirming a production batch recipe
    applicability:
      required_source_features:
        - input components or ingredients
        - quality attributes, composition coefficients, or nutrient contents
        - blend requirements, lower bounds, upper bounds, or total batch size
      incompatible_source_features:
        - route sequencing
        - facility siting
        - binary coverage matrices unless explicitly present
    common_scenarios:
      - scenario_id: family_blending_fuel_mix
        industry: energy blending
        background: a refinery blends input streams to meet product quality limits at minimum cost
        entities: [components, quality attributes, blend requirements, costs]
        units: [barrels, quality units, dollars]
      - scenario_id: family_blending_material_mix
        industry: materials manufacturing
        background: a plant mixes raw materials to satisfy composition specifications
        entities: [raw materials, composition percentages, quality bounds, costs]
        units: [tons, percent, dollars]
    modeling_notes:
      - Use continuous blend quantities unless batch indivisibility is explicit.
      - Include all quality lower and upper bounds.

  diet:
    business_triggers:
      - during a menu cost review
      - after nutrition requirements were updated
      - before publishing a meal or feed formulation plan
    applicability:
      required_source_features:
        - food, ingredient, or feed item set
        - nutrient or quality attribute set
        - nutrient-content table and nutrient lower or upper bounds
        - per-item costs or serving limits
      incompatible_source_features:
        - vehicle routes
        - facility opening decisions
        - network arc flow conservation
    common_scenarios:
      - scenario_id: family_diet_hospital_nutrition
        industry: healthcare nutrition
        background: a hospital designs a low-cost meal plan satisfying nutrient ranges
        entities: [foods, nutrients, nutrient bounds, ingredient limits]
        units: [servings, nutrient units, dollars]
      - scenario_id: family_diet_feed_blending
        industry: agriculture
        background: a farm creates a least-cost feed blend while meeting nutrition requirements
        entities: [feed ingredients, nutrients, minimum requirements, maximum limits]
        units: [kilograms, nutrient units, dollars]
    modeling_notes:
      - Use continuous ingredient quantities unless indivisible packages are explicit.
      - Present the full nutrient-content table, lower bounds, upper bounds, and item costs.

  facility_location:
    business_triggers:
      - during a network expansion planning round
      - after regional demand forecasts were revised
      - during a capital site-selection review
    applicability:
      required_source_features:
        - candidate facilities, sites, towers, hubs, or service locations
        - demand zones, customers, communities, or neighborhoods
        - fixed opening costs, assignment costs, capacities, or coverage indicators
        - binary open-close or site-selection decisions
      incompatible_source_features:
        - vehicle route sequencing
        - cutting patterns
        - meal nutrient tables
    common_scenarios:
      - scenario_id: family_facility_retail_distribution
        industry: retail distribution
        background: a retailer decides which facilities to open and how to serve demand zones
        entities: [candidate facilities, demand zones, fixed costs, service costs]
        units: [facilities, demand units, dollars]
      - scenario_id: family_facility_public_infrastructure
        industry: public infrastructure
        background: a city chooses service sites to cover neighborhoods under budget limits
        entities: [sites, neighborhoods, coverage distances, capacities]
        units: [sites, residents, kilometers]
    modeling_notes:
      - Use binary open/close variables for facilities and assignment or flow variables for demand service.
      - Do not add coverage or capacity constraints unless they exist in the source.

  covering:
    business_triggers:
      - after minimum coverage standards were updated
      - during a risk-control coverage audit
      - before committing a fixed service budget
    applicability:
      required_source_features:
        - candidate covering options
        - zones, requirements, risks, or elements to cover
        - binary coverage matrix or coverage counts
        - cost or resource use for each selected option
      incompatible_source_features:
        - continuous shipment amounts
        - route subtour constraints
        - production inventory balances
    common_scenarios:
      - scenario_id: family_covering_emergency_services
        industry: emergency services
        background: a city selects service units so all zones are covered
        entities: [candidate units, zones, coverage matrix, costs]
        units: [units, zones, dollars]
      - scenario_id: family_covering_quality_controls
        industry: quality assurance
        background: a manufacturer chooses inspections that cover required risk categories
        entities: [inspection options, risk categories, coverage indicators, costs]
        units: [checks, categories, dollars]
    modeling_notes:
      - Preserve binary coverage coefficients and coverage requirements exactly.

  portfolio:
    business_triggers:
      - during an investment committee review
      - after risk limits were tightened
      - during annual capital allocation planning
    applicability:
      required_source_features:
        - assets, initiatives, or projects
        - returns, benefits, risks, costs, or budgets
        - budget, diversification, risk, or selection constraints
      incompatible_source_features:
        - node-arc flow conservation
        - vehicle time windows
        - nutrient composition requirements
    common_scenarios:
      - scenario_id: family_portfolio_investment_selection
        industry: investment management
        background: an investment team allocates capital across assets under risk and return limits
        entities: [assets, returns, risks, budget]
        units: [dollars, return units, risk units]
      - scenario_id: family_portfolio_project_mix
        industry: strategic planning
        background: an organization selects a balanced portfolio of initiatives
        entities: [initiatives, costs, benefits, risk scores]
        units: [dollars, score points]
    modeling_notes:
      - Use continuous allocation variables for divisible investments and binary variables for project selection.

  revenue_management:
    business_triggers:
      - before opening a booking or sales window
      - after demand limits were reforecast
      - during a capacity allocation review
    applicability:
      required_source_features:
        - products, fare classes, segments, or booking classes
        - limited inventory or capacity
        - unit revenues and demand upper bounds
      incompatible_source_features:
        - facility fixed-charge opening decisions
        - vehicle routing subtours
        - ingredient nutrient bounds
    common_scenarios:
      - scenario_id: family_revenue_ticket_capacity
        industry: travel revenue management
        background: a carrier allocates limited capacity among fare products to maximize revenue
        entities: [fare classes, demand limits, capacities, revenues]
        units: [seats, tickets, dollars]
      - scenario_id: family_revenue_ad_inventory
        industry: media sales
        background: a sales team allocates limited inventory across contract classes
        entities: [ad products, impressions, demand limits, prices]
        units: [impressions, contracts, dollars]
    modeling_notes:
      - Preserve demand upper bounds, capacities, and unit revenues exactly.

  marketing:
    business_triggers:
      - before a campaign launch approval
      - after regional market-share targets changed
      - during a quarterly media-budget review
    applicability:
      required_source_features:
        - markets, segments, campaigns, channels, or initiatives
        - reach, lift, market-share, or response coefficients
        - budget, exposure, segment, or resource constraints
      incompatible_source_features:
        - physical shipment flow balance
        - machine sequencing
        - cutting stock patterns
    common_scenarios:
      - scenario_id: family_marketing_channel_mix
        industry: marketing analytics
        background: a marketing team allocates campaign effort across customer segments
        entities: [segments, channels, reach coefficients, budgets]
        units: [campaigns, impressions, dollars]
      - scenario_id: family_marketing_market_share
        industry: consumer growth
        background: a brand chooses promotions to improve market share under resource limits
        entities: [markets, promotion types, share lift, spending caps]
        units: [markets, percentage points, dollars]
    modeling_notes:
      - Keep market-share, budget, and segment constraints separate.

  contract_allocation:
    business_triggers:
      - during a supplier award committee meeting
      - after vendor capacity information changed
      - before publishing contract award recommendations
    applicability:
      required_source_features:
        - suppliers, vendors, contracts, lots, or service regions
        - bids, prices, eligibility, capacities, or policy limits
        - allocation, award, minimum, or maximum volume constraints
      incompatible_source_features:
        - route time windows
        - nutrient-content tables
        - cutting patterns
    common_scenarios:
      - scenario_id: family_contract_supplier_allocation
        industry: procurement
        background: a procurement office allocates contract volume across qualified suppliers
        entities: [suppliers, contracts, capacities, bids]
        units: [units, contracts, dollars]
      - scenario_id: family_contract_service_awards
        industry: public procurement
        background: an agency awards service contracts while satisfying coverage and policy rules
        entities: [vendors, service lots, eligibility, costs]
        units: [contracts, service units, dollars]
    modeling_notes:
      - Preserve eligibility, minimum/maximum allocation, and supplier capacity rules.

  supply_chain:
    business_triggers:
      - after supplier availability changed
      - during a multi-echelon replenishment review
      - during disruption recovery planning
    applicability:
      required_source_features:
        - suppliers, plants, warehouses, customers, hubs, or demand zones
        - production, shipment, inventory, or demand-balance variables
        - capacities, demands, lane costs, production costs, or inventory costs
      incompatible_source_features:
        - single-vehicle route sequence
        - meal nutrient tables
        - pairwise dispersion objective unless explicitly present
    common_scenarios:
      - scenario_id: family_supply_chain_multiechelon
        industry: supply chain planning
        background: a company coordinates production, warehouses, and customer demand
        entities: [plants, warehouses, customers, flows, inventories]
        units: [units, pallets, dollars]
      - scenario_id: family_supply_chain_resilience
        industry: resilient logistics
        background: a supply chain team plans shipments under capacity and disruption limits
        entities: [suppliers, hubs, demand zones, capacities]
        units: [units, lanes, dollars]
    modeling_notes:
      - Keep production, inventory, shipment, and demand-balance constraints distinct.

  network_design:
    business_triggers:
      - during a network redesign proposal
      - after capacity bottlenecks were reported
      - before approving fixed link or hub investments
    applicability:
      required_source_features:
        - network nodes and arcs or links
        - commodities, traffic classes, or demand pairs when multicommodity
        - fixed activation decisions, arc capacities, routing costs, or throughput limits
      incompatible_source_features:
        - meal nutrient lower bounds
        - cutting-stock demand patterns
        - pure item packing without network arcs
    common_scenarios:
      - scenario_id: family_network_design_freight
        industry: freight network design
        background: a carrier decides which lanes or hubs to activate and how to route flow
        entities: [nodes, arcs, commodities, capacities, fixed costs]
        units: [shipments, arcs, dollars]
      - scenario_id: family_network_design_telecom
        industry: telecommunications
        background: a network operator activates links and routes demand through the network
        entities: [nodes, links, traffic demands, capacities]
        units: [Gbps, links, dollars]
    modeling_notes:
      - Preserve commodity flow balance, arc capacities, and fixed activation costs.

  network_flow:
    business_triggers:
      - after lane costs were updated
      - during a throughput or routing cost review
      - after supply and demand locations changed
    applicability:
      required_source_features:
        - nodes and directed or undirected arcs
        - supplies, demands, source-sink pair, or flow-conservation constraints
        - arc costs, capacities, or path costs
      incompatible_source_features:
        - facility open-close fixed costs unless explicitly present
        - vehicle route subtour constraints
        - nutrient-composition bounds
    common_scenarios:
      - scenario_id: family_network_flow_distribution
        industry: distribution networks
        background: a logistics team routes goods through a capacitated network
        entities: [nodes, arcs, supplies, demands, arc costs]
        units: [units, arcs, dollars]
      - scenario_id: family_network_flow_data_routing
        industry: digital infrastructure
        background: an infrastructure team routes traffic through network links
        entities: [routers, links, traffic demands, link costs]
        units: [Gbps, links, cost units]
    modeling_notes:
      - State arc list, supplies/demands, and conservation constraints clearly.

  routing:
    business_triggers:
      - after customer time windows were confirmed
      - during daily route dispatch planning
      - after a fleet capacity disruption
    applicability:
      required_source_features:
        - customer, depot, vehicle, location, or route node set
        - travel times, distances, route costs, demands, or service windows
        - visit-once, route continuity, capacity, subtour, or sequencing constraints
      incompatible_source_features:
        - pure supply-demand transportation matrix without route continuity
        - diet nutrient tables
        - project portfolio budget selection
    common_scenarios:
      - scenario_id: family_routing_delivery_routes
        industry: last-mile logistics
        background: a delivery operator plans vehicle routes to serve customers
        entities: [vehicles, customers, depots, travel times, time windows]
        units: [vehicles, minutes, kilometers]
      - scenario_id: family_routing_field_service
        industry: field service operations
        background: a service company routes technicians to customer visits
        entities: [technicians, visits, time windows, travel costs]
        units: [visits, minutes, dollars]
    modeling_notes:
      - Preserve customer, depot, arc, capacity, and time-window data exactly.

  transportation:
    business_triggers:
      - during a weekly replenishment planning cycle
      - after a demand surge changed store requirements
      - after a regional disruption shifted available supply
      - before approving an emergency shipment plan
    applicability:
      required_source_features:
        - two indexed node sets such as sources and destinations
        - nonnegative flow variable x[i,j]
        - supply vector
        - demand vector
        - lane cost matrix
      incompatible_source_features:
        - vehicle routes
        - time windows
        - subtour constraints
        - sequencing variables
        - multi-period inventory carryover unless the source has periods
    common_scenarios:
      - scenario_id: family_transport_warehouse_to_store
        industry: retail logistics
        background: warehouses ship goods to stores while minimizing transportation cost
        entities: [warehouses, stores, supplies, demands, lane costs]
        units: [pallets, dollars per pallet]
      - scenario_id: family_transport_relief_supplies
        industry: disaster relief logistics
        background: relief depots allocate supply kits to shelters or clinics
        entities: [depots, shelters, supplies, demands, transport costs]
        units: [kits, dollars per kit]
    modeling_notes:
      - Use continuous nonnegative shipment quantities for the standard transportation LP.
      - Present the complete supply vector, demand vector, and cost matrix.
    forbidden_misframings:
      - Do not turn transportation into vehicle routing unless vehicles and route constraints exist.

  lot_sizing:
    business_triggers:
      - during a rolling replenishment planning cycle
      - after period demand forecasts changed
      - before locking production or order releases
    applicability:
      required_source_features:
        - discrete time periods
        - period demand values
        - production, ordering, setup, inventory, or backlog variables
        - inventory balance, demand satisfaction, setup, or capacity constraints
      incompatible_source_features:
        - single-period item packing without inventory carryover
        - vehicle route sequencing
        - facility site coverage matrices
    common_scenarios:
      - scenario_id: family_lot_sizing_factory_inventory
        industry: manufacturing planning
        background: a factory schedules production lots over time while balancing setup and inventory costs
        entities: [products, periods, demand, setup costs, inventory costs]
        units: [units, periods, dollars]
      - scenario_id: family_lot_sizing_retail_replenishment
        industry: retail replenishment
        background: a retailer plans replenishment quantities across weeks
        entities: [items, weeks, demand, holding cost, order cost]
        units: [units, weeks, dollars]
    modeling_notes:
      - Preserve period-by-period demand, setup, capacity, and inventory-balance constraints.

  production_planning:
    business_triggers:
      - during a weekly production planning meeting
      - after resource availability was updated
      - before committing product-mix targets
    applicability:
      required_source_features:
        - products, grades, processes, machines, or resources
        - resource consumption coefficients
        - capacities, demand bounds, profits, costs, or margins
        - continuous or integer production quantity decisions
      incompatible_source_features:
        - vehicle route subtours
        - nutrient requirement tables unless the source is blending or diet
        - pure coverage matrix without production quantities
    common_scenarios:
      - scenario_id: family_production_factory_mix
        industry: manufacturing
        background: a factory chooses production quantities for multiple products under resource limits
        entities: [products, resources, capacities, profits, costs]
        units: [units, machine hours, dollars]
      - scenario_id: family_production_steel_planning
        industry: steel production
        background: a mill plans steel production across grades and processes
        entities: [steel grades, processes, capacities, margins]
        units: [tons, hours, dollars]
    modeling_notes:
      - Preserve resource consumption coefficients, capacities, and product profit/cost data.

  agriculture:
    business_triggers:
      - before a seasonal crop plan is approved
      - after water or labor availability changed
      - during a farm budget planning review
    applicability:
      required_source_features:
        - crops, fields, land, livestock feed, or farm activities
        - acreage, yield, labor, water, feed, or resource coefficients
        - land, labor, water, budget, demand, or nutrition constraints
      incompatible_source_features:
        - vehicle route sequencing
        - telecom link activation
        - unrelated facility coverage without farm resources
    common_scenarios:
      - scenario_id: family_agriculture_crop_plan
        industry: farm planning
        background: a farm allocates land, labor, and resources across crops
        entities: [crops, acreage, labor, water, profit]
        units: [acres, hours, dollars]
      - scenario_id: family_agriculture_feed_and_land
        industry: agricultural operations
        background: a farm balances crop production and resource availability
        entities: [fields, crops, resource limits, yields]
        units: [acres, tons, dollars]
    modeling_notes:
      - Keep land, labor, water, and yield constraints explicit.

  energy:
    business_triggers:
      - during a day-ahead dispatch run
      - after demand forecasts or fuel prices changed
      - before approving generation or capacity commitments
    applicability:
      required_source_features:
        - generators, periods, assets, lines, or power resources
        - demand, capacity, generation cost, ramping, or reliability coefficients
        - energy balance, capacity, output bound, or investment constraints
      incompatible_source_features:
        - meal nutrient tables
        - parcel packing capacity only
        - route subtour elimination
    common_scenarios:
      - scenario_id: family_energy_dispatch
        industry: electric power operations
        background: a grid operator schedules generation to meet demand at minimum cost
        entities: [generators, demand periods, capacities, generation costs]
        units: [MW, MWh, dollars]
      - scenario_id: family_energy_capacity_planning
        industry: energy planning
        background: a utility chooses generation or transmission investments under reliability limits
        entities: [assets, capacities, demand, costs]
        units: [MW, dollars]
    modeling_notes:
      - Preserve demand balance, generation bounds, and cost coefficients exactly.

  workforce_deployment:
    business_triggers:
      - during a readiness allocation review
      - after mission requirements changed
      - before publishing staffing or deployment orders
    applicability:
      required_source_features:
        - personnel groups, teams, missions, regions, or shifts
        - readiness, staffing, skill, capacity, or coverage coefficients
        - assignment, deployment, minimum coverage, or capacity constraints
      incompatible_source_features:
        - freight lane cost matrix without personnel units
        - production inventory carryover unless staffing periods exist
        - cutting patterns
    common_scenarios:
      - scenario_id: family_workforce_deployment_units
        industry: defense logistics
        background: planners deploy personnel units to missions under capacity and readiness limits
        entities: [units, missions, readiness scores, deployment costs]
        units: [personnel, units, dollars]
      - scenario_id: family_workforce_public_safety
        industry: public safety staffing
        background: an agency assigns teams to regions while meeting coverage requirements
        entities: [teams, regions, staffing levels, coverage needs]
