  optmath_steel4:
    task_family: production_planning
    business_triggers:
      - after available hours changed at a bottleneck production stage
      - before a weekly product-mix plan is released to operations
      - after minimum customer commitments were updated
      - before sales accepts maximum market commitments by product
      - during a margin review for competing steel grades
      - after maintenance reduced capacity on a finishing or rolling resource
    applicability:
      required_source_features:
        - product set with profit per ton
        - production stage or process resource set
        - continuous production quantity variable by product
        - production rate or processing-hours-per-ton table by product and stage
        - available hours table by production stage
        - minimum commitment lower bound by product
        - maximum market upper bound by product
        - stage capacity constraints using processing hours per ton times production tons
      incompatible_source_features:
        - time periods
        - inventory carryover
        - backlog
        - binary product selection
        - setup or fixed-charge production variables
        - job sequencing or machine ordering
        - vehicle routing or shipment lanes
    required_parameter_presentation:
      - list all products or steel grades
      - list all production stages as process resources, not planning periods
      - list profit per ton, minimum commitment, and maximum market demand for every product
      - list production rates or processing hours per ton for every product-stage pair
      - list available hours for every production stage
      - state production variables are continuous tons, not binary product selection
      - state stage capacity uses processing hours per ton multiplied by production tons
      - state the model has no inventory, backlog, setup, sequencing, or time-period carryover
    forbidden_misframings:
      - Do not describe stages as time periods.
      - Do not add inventory carryover, backlog, storage, or demand balance across periods.
      - Do not add binary product-selection, setup, or fixed-charge production decisions.
      - Do not add job-shop sequencing, machine-ordering, or non-overlap constraints.
      - Do not use production rates directly as time consumption; use reciprocal processing hours per ton.
      - Do not omit minimum commitment lower bounds or maximum market upper bounds.
    modeling_notes:
      - Preserve the continuous product-mix LP structure.
      - Treat stages as shared production resources such as melting, casting, rolling, heat treatment, finishing, inspection, or packaging.
      - Keep the objective as profit maximization over produced tons.
      - Keep minimum commitments and maximum market limits separate from stage capacity.
    scenarios:
      - scenario_id: steel4_multi_stage_steel_plan
        industry: steel production
        background: a mill chooses steel-grade output across melting, casting, rolling, and finishing resources
        business_triggers:
          - before a weekly product-mix plan is released to operations
          - after available hours changed at a bottleneck production stage
        entities: [steel grades, production stages, available hours, profit margins, commitment bounds, market limits]
      - scenario_id: steel4_specialty_alloy_plan
        industry: specialty metals
        background: a plant chooses specialty alloy tonnage under furnace, caster, and finishing-stage capacity
        business_triggers:
          - after minimum customer commitments were updated
          - during a margin review for competing alloy grades
        entities: [alloy grades, furnaces, casters, finishing lines, hours, profit per ton, market bounds]
      - scenario_id: steel4_rolling_mill_grade_mix
        industry: flat steel rolling
        background: a rolling mill selects tonnage for several sheet products while shared rolling and inspection stages have limited hours
        business_triggers:
          - after maintenance reduced rolling-mill availability
          - before sales accepts maximum market commitments by product
        entities: [sheet products, rolling stages, inspection stages, processing hours, margins, minimum tons, market tons]
      - scenario_id: steel4_heat_treatment_alloy_mix
        industry: heat-treated metals
        background: a heat-treatment facility decides alloy output using limited furnace, quench, tempering, and finishing capacity
        business_triggers:
          - after heat-treatment capacity was reduced by maintenance
          - before a priority customer order mix is approved
        entities: [alloys, furnace stages, quench stages, tempering hours, finishing hours, commitments, market demand]
      - scenario_id: steel4_automotive_grade_commitment_plan
        industry: automotive steel supply
        background: a supplier chooses production tons for automotive steel grades under shared process-stage capacity and customer commitments
        business_triggers:
          - after automaker minimum commitments were revised
          - before monthly automotive supply commitments are finalized
        entities: [automotive grades, process stages, capacity hours, per-ton margins, committed tons, market ceilings]
      - scenario_id: steel4_construction_beam_capacity_plan
        industry: construction steel
        background: a structural steel producer balances beam and section output across melting, casting, rolling, and inspection stages
        business_triggers:
          - after construction demand forecasts changed
          - before a capacity-constrained weekly mill plan is approved
        entities: [beam products, mill stages, available hours, tonnage commitments, market limits, profit per ton]
      - scenario_id: steel4_stainless_finishing_plan
        industry: stainless steel finishing
        background: a stainless finishing shop chooses tonnage for grades that consume polishing, coating, and inspection hours differently
        business_triggers:
          - after finishing-line labor hours changed
          - during a high-margin stainless grade prioritization review
        entities: [stainless grades, polishing stages, coating stages, inspection hours, margins, commitments, market demand]
      - scenario_id: steel4_foundry_casting_grade_plan
        industry: foundry operations
        background: a foundry plans casting-grade output with limited melting, molding, casting, and cleanup-stage hours
        business_triggers:
          - after foundry cleanup capacity became scarce
          - before casting orders are released to production
        entities: [casting grades, foundry stages, available process hours, minimum tons, maximum market tons, profit per ton]
      - scenario_id: steel4_coil_packaging_capacity_plan
        industry: coil processing
        background: a coil processor chooses output for coil products that share slitting, coating, inspection, and packaging resources
        business_triggers:
          - before a packaging-stage cutoff for outbound coils
          - after slitting-line availability was revised
        entities: [coil products, slitting stages, coating stages, packaging hours, product margins, commitments, market bounds]
      - scenario_id: steel4_mill_budget_commitment_plan
        industry: integrated mill operations
        background: a mill planning team maximizes contribution margin by allocating limited process-stage hours across committed and market-limited products
        business_triggers:
          - during an executive margin review
          - before operations locks a product-mix recommendation
        entities: [mill products, production-stage hours, contribution margins, minimum commitments, market caps, processing rates]

  optmath_team_formulation:
    task_family: workforce_planning
    business_triggers:
      - before assigning people to strategic projects
      - after skill requirements were revised by project leads
      - during a project portfolio staffing review
      - after a new project intake created skill gaps
      - before leadership approves cross-functional team assignments
    applicability:
      required_source_features:
        - people set
        - project set
        - skill set
        - binary Assign[p,c] person-project assignment variables
        - individual skill level matrix by person and skill
        - required skill level matrix by project and skill
        - continuous AttainedSkill[c,s] variables
        - continuous SkillShortage[c,s] variables
        - continuous MaxSkillShortage variable
        - exactly-one project assignment per person
        - at-least-one person per project
      incompatible_source_features:
        - compatibility-score maximization
        - pairwise team chemistry variables
        - route, travel, or sequencing constraints
        - project durations or time-window scheduling
        - capacity hours or workload fractions
        - one-to-one matching between people and projects
    required_parameter_presentation:
      - list people, projects, and skills
      - list individual skill levels for every person-skill pair
      - list required skill levels for every project-skill pair
      - state each person is assigned to exactly one project
      - state each project receives at least one person
      - state attained skill equals the sum of assigned individual skill levels
      - state skill shortage covers the gap between required and attained skill
      - state the objective minimizes maximum skill shortage first, then total shortage
    forbidden_misframings:
      - Do not describe this as compatibility-score maximization.
      - Do not omit AttainedSkill, SkillShortage, or MaxSkillShortage.
      - Do not treat project skill requirements as optional preferences.
      - Do not turn the problem into one-to-one matching.
      - Do not introduce routing, travel, sequencing, project durations, or time windows.
    modeling_notes:
      - The model intentionally allows skill shortfalls and minimizes them.
      - AttainedSkill is additive over assigned people, not a maximum skill among assigned people.
      - The objective is shortage minimization, not maximizing team quality or compatibility.
      - Every project must receive at least one assigned person.
    scenario_lenses:
      - lens_id: consulting_project_skill_staffing
        industry: professional services
        context: assign consultants to projects so required skill gaps are minimized
        entities: [consultants, client projects, skills, skill requirements, shortages]
      - lens_id: research_program_team_assignment
        industry: research management
        context: assign researchers to programs while minimizing the largest skill gap
        entities: [researchers, research programs, skills, required skill levels]
      - lens_id: product_squad_staffing
        industry: software product operations
        context: staff product squads with engineers, analysts, and designers under skill requirements
        entities: [staff members, squads, technical skills, required skill levels]
      - lens_id: hospital_improvement_team_staffing
        industry: healthcare operations
        context: assign clinicians and analysts to improvement projects while tracking skill shortages
        entities: [clinicians, improvement projects, competencies, requirement levels]
      - lens_id: public_agency_project_cells
        industry: public administration
        context: assign specialists to delivery cells so each cell has enough capability coverage
        entities: [specialists, delivery cells, capabilities, shortage variables]
    scenarios:
      - scenario_id: team_formulation_project_team
        industry: professional services
        background: a consulting firm assigns consultants to client projects while minimizing the worst project-skill shortage
        business_triggers:
          - before assigning people to strategic projects
          - after skill requirements were revised by project leads
        entities: [consultants, client projects, skills, attained skill, skill shortages]
      - scenario_id: team_formulation_research_groups
        industry: research management
        background: a lab assigns researchers to research programs so required capability gaps are as small as possible
        business_triggers:
          - during a project portfolio staffing review
          - after a new project intake created skill gaps
        entities: [researchers, programs, skills, required skill levels, shortage measures]
      - scenario_id: team_formulation_product_squads
        industry: software product operations
        background: a product organization assigns staff to squads and minimizes missing technical skill coverage
        business_triggers:
          - before leadership approves cross-functional team assignments
          - after skill requirements were revised by project leads
        entities: [staff members, product squads, technical skills, attained skill, skill shortage]
      - scenario_id: team_formulation_healthcare_improvement
        industry: healthcare operations
        background: a hospital assigns clinicians and analysts to improvement projects while minimizing capability gaps
        business_triggers:
          - during a project portfolio staffing review
          - after a new project intake created skill gaps
        entities: [clinicians, analysts, improvement projects, competencies, shortage levels]
      - scenario_id: team_formulation_public_delivery_cells
        industry: public administration
        background: an agency assigns specialists to delivery cells so the largest unmet capability requirement is minimized
        entities: [specialists, delivery cells, capabilities, required levels, maximum shortage]
      - scenario_id: team_formulation_grant_review_panels
        industry: research funding
        background: a funding office assigns experts to review panels while minimizing missing expertise across panels
        entities: [experts, review panels, expertise areas, requirement levels, skill shortages]
      - scenario_id: team_formulation_cyber_response_cells
        industry: cybersecurity operations
        background: a security operations center assigns analysts to response cells while minimizing coverage gaps in required skills
        entities: [analysts, response cells, incident skills, attained skill, shortage variables]
      - scenario_id: team_formulation_maintenance_task_forces
        industry: industrial maintenance
        background: a maintenance planner assigns technicians to task forces and tracks unmet skill requirements
        entities: [technicians, task forces, maintenance skills, requirements, shortages]
      - scenario_id: team_formulation_education_support_teams
        industry: education services
        background: a district assigns staff to student support teams while minimizing the worst unmet service capability
        entities: [staff, support teams, service capabilities, required levels, skill shortages]
      - scenario_id: team_formulation_nonprofit_program_crews
        industry: nonprofit program delivery
        background: a nonprofit assigns staff to program crews so capability shortages are minimized across all crews
        entities: [staff, program crews, capabilities, attained capability, maximum shortage]

  optmath_transp:
    task_family: transportation
    business_triggers:
      - during a weekly replenishment cycle
      - after demand forecasts were updated
      - before a dispatch or allocation deadline
      - after available supply was confirmed
    applicability:
      required_source_features:
        - origin set
        - destination set
        - continuous nonnegative origin-destination shipment variables
        - exact origin supply equality
        - exact destination demand equality
        - complete lane cost matrix
        - total supply equals total demand
      incompatible_source_features:
        - vehicles or vehicle routes
        - time windows or service times
        - subtour constraints
        - lane capacities
        - fixed lane activation costs
        - binary lane activation variables
        - facility opening decisions
        - inventory carryover
        - unmet demand or optional unused supply
    required_parameter_presentation:
      - list origins and supply for every origin
      - list destinations and demand for every destination
      - list complete origin-destination lane cost matrix
      - state total supply equals total demand
      - state shipment variables are continuous and nonnegative
      - state every origin ships exactly its supply and every destination receives exactly its demand
      - prefer compact_transportation_tables when listing numeric data
    forbidden_misframings:
      - Do not describe this as vehicle routing or delivery-tour planning.
      - Do not introduce vehicles, depots, subtours, service times, or time windows.
      - Do not add lane capacities, fixed-charge activation, or binary lane decisions.
      - Do not introduce facility-opening decisions.
      - Do not allow unmet demand or unused supply.
    modeling_notes:
      - Preserve exact balanced transportation equalities.
      - The objective is total lane shipping cost minimization.
      - Every origin-destination lane in the cost matrix is available.
      - There is no internal feasible shipment certificate in the business statement.
    scenarios:
      - scenario_id: transp_warehouse_to_store_distribution
        industry: retail logistics
        background: warehouses ship goods to stores to meet demand at minimum cost
        business_triggers:
          - during a weekly store replenishment cycle
          - after a demand surge changed store replenishment needs
        entities: [warehouses, stores, supplies, demands, cost matrix]
      - scenario_id: transp_relief_depot_to_shelter
        industry: disaster relief logistics
        background: relief depots ship supply kits to shelters with known demand
        business_triggers:
          - after a regional flood disrupted local supply chains
          - before an emergency response team approves shelter allocations
        entities: [depots, shelters, available kits, requested kits, lane costs]
      - scenario_id: transp_factory_to_regional_dc
        industry: manufacturing distribution
        background: factories ship finished goods to regional distribution centers while meeting each center's replenishment demand
        business_triggers:
          - after weekly production output was confirmed
          - before regional replenishment orders are released
        entities: [factories, regional distribution centers, available production, replenishment demand, shipping costs]
      - scenario_id: transp_food_bank_to_pantries
        industry: food bank logistics
        background: a food bank allocates pallet shipments from storage hubs to community pantries with fixed requested quantities
        business_triggers:
          - during a seasonal donation allocation cycle
          - after pantry demand forecasts were updated
        entities: [storage hubs, community pantries, pallet supply, requested pallets, delivery costs]
      - scenario_id: transp_medical_supply_to_clinics
        industry: healthcare logistics
        background: a medical supply coordinator ships standard supply packs from warehouses to clinics at minimum distribution cost
        business_triggers:
          - before a monthly clinic replenishment window
          - after clinic consumption reports changed demand
        entities: [medical warehouses, clinics, supply packs, clinic demand, lane costs]
      - scenario_id: transp_energy_material_to_plants
        industry: energy operations
        background: material yards ship maintenance parts to power plants so plant requests are filled exactly
        business_triggers:
          - before a planned outage maintenance window
          - after parts availability was confirmed at yards
        entities: [material yards, power plants, available parts, plant requests, transport costs]
      - scenario_id: transp_ecommerce_fulfillment_to_zones
        industry: ecommerce fulfillment
        background: fulfillment centers ship identical order batches to delivery zones while matching zone volume requirements
        business_triggers:
          - before a same-day delivery wave is released
          - after zone order volumes were locked
        entities: [fulfillment centers, delivery zones, batch supply, zone volume, lane cost matrix]
      - scenario_id: transp_agricultural_packhouses_to_markets
        industry: agricultural supply chain
        background: packhouses ship produce cases to wholesale markets with known market demand
        business_triggers:
          - after harvest quantities were graded
          - before market purchase orders are dispatched
        entities: [packhouses, wholesale markets, available cases, market demand, freight costs]
      - scenario_id: transp_public_works_salt_depots
        industry: public works operations
        background: salt depots ship road-treatment material to municipal service yards before a winter storm
        business_triggers:
          - before a storm preparation deadline
          - after service-yard material requests were finalized
        entities: [salt depots, service yards, available tons, requested tons, haul costs]
      - scenario_id: transp_lab_sample_courier_hubs
        industry: laboratory logistics
        background: courier hubs move standardized sample containers to testing labs while meeting each lab's intake target
        business_triggers:
          - before an overnight lab intake cutoff
          - after hub collection volumes were counted
        entities: [courier hubs, testing labs, sample containers, lab intake targets, transfer costs]
