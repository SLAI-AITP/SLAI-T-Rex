    variation_axes:
      narrative_angles:
        - angle_id: network_budget_review
          description: focus on fixed center operating budgets and throughput charges
          business_triggers: [before the distribution-center budget is approved]
        - angle_id: service_territory_reassignment
          description: focus on assigning each customer zone to exactly one selected center
          business_triggers: [during a service-territory reassignment planning cycle]
        - angle_id: capacity_shortage_response
          description: focus on throughput bounds after one candidate center became capacity constrained
          business_triggers: [after a capacity shortage was identified at a candidate hub]
        - angle_id: peak_season_network_commitment
          description: focus on locking the network for a peak-season replenishment window
