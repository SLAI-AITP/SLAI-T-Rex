  optmath_facility_location:
    task_family: facility_location
    variant_policy:
      use_only_generator_scenario_lenses: true
      use_only_generator_variation_axes:
        - narrative_angles
        - organization_profiles
        - planning_horizons
        - entity_naming_styles
    business_triggers:
      - after regional demand shifted across customer zones
      - before distribution-center operating budgets are approved
      - after one candidate hub became capacity constrained
      - during a network redesign review for multiple product families
      - before peak-season fulfillment commitments are locked
      - after fixed facility operating costs were renegotiated
      - during a service-territory reassignment planning cycle
      - after supply availability changed at product plants
    applicability:
      required_source_features:
        - commodity set
        - product plant set
        - candidate distribution center set
        - customer zone set
        - continuous nonnegative Shipped[c,p,d,z] variables
        - binary Selected[d] distribution-center opening variables
        - binary Served[d,z] zone-assignment variables
        - commodity-plant supply table
        - commodity-zone demand table
        - four-index variable shipping cost table
        - fixed distribution-center selection cost
        - unit throughput cost and throughput bounds
      incompatible_source_features:
        - vehicle routes
        - customer visit sequencing
        - subtour elimination constraints
        - time windows
        - driver or vehicle indices
        - path conservation constraints
        - pure one-commodity transportation flow without facility opening
    required_parameter_presentation:
      - list commodities, product plants, distribution centers, and customer zones
      - list commodity-plant supply and commodity-zone demand tables
      - list fixed cost, unit throughput cost, minimum throughput, and maximum throughput for each distribution center
      - list variable shipping costs indexed by commodity, plant, distribution center, and customer zone
      - state each customer zone must be assigned to exactly one distribution center
      - state a zone can be assigned to a distribution center only if that center is selected/opened
      - state exact commodity demand shipped through the assigned center must match zone demand
      - state this is a compact multi-commodity distribution-center selection problem, not vehicle routing
    forbidden_misframings:
      - Do not introduce vehicles, route arcs, subtour constraints, or customer visit order.
      - Do not collapse Shipped[c,p,d,z] into a single customer-to-facility assignment variable.
      - Do not omit fixed distribution-center opening costs.
      - Do not omit unit throughput costs or throughput bounds.
      - Do not omit the explicit open-before-assignment link Served[d,z] <= Selected[d].
      - Do not change cost minimization into service maximization or profit maximization.
    modeling_notes:
      - Preserve the three decision layers: Selected[d], Served[d,z], and Shipped[c,p,d,z].
      - Preserve exact served-demand equalities for every commodity, distribution center, and zone.
      - Preserve both minimum and maximum throughput links for selected distribution centers.
      - Preserve the facility-limit policy that prevents all candidate centers from opening.
    scenario_lenses:
