    modeling_notes:
      - This is uncapacitated lot sizing with backlogging, not capacitated production planning.
      - The carried state is net inventory: ending inventory minus backlog.
      - Backlog can move demand fulfillment to later periods and incurs a per-period penalty.
      - Setup linking uses total demand as the big-M upper bound for each period's order quantity.
