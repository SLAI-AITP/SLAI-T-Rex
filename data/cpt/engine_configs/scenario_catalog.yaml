      - before approving a lowest-cost redistribution plan
      - after node-level supply and demand were reconciled
      - during a network resilience dispatch review
      - before a public-service logistics plan is released
    applicability:
      required_source_features:
        - city or node set
        - directed arc set
        - supply and demand at every node
        - total supply equals total demand
        - continuous nonnegative flow variable on each directed arc
        - per-unit cost on each directed arc
        - hard capacity on each directed arc
        - node flow balance constraints
      incompatible_source_features:
        - vehicle routes
        - time windows
        - subtour constraints
        - binary arc activation
        - fixed opening costs
        - facility opening decisions
        - optional unmet demand
    required_parameter_presentation:
      - list all nodes and directed arcs
      - list supply and demand for every node, including zero values
      - state total supply equals total demand
      - list per-unit shipping cost for every directed arc
      - list hard capacity for every directed arc
      - state flow balance as supply plus inbound flow equals demand plus outbound flow
      - state all arc-flow variables are continuous and nonnegative
    forbidden_misframings:
      - Do not describe this as vehicle routing.
      - Do not introduce trucks, drivers, tours, time windows, or subtour constraints.
      - Do not add binary arc-opening or fixed-charge decisions.
      - Do not allow unmet demand or disposal slack.
      - Do not omit arc capacities.
    modeling_notes:
      - This is a capacitated minimum-cost network-flow LP.
      - Intermediate nodes may have zero supply and zero demand but must still conserve flow.
      - The decision variable is flow on a listed directed arc, not path selection or vehicle movement.
