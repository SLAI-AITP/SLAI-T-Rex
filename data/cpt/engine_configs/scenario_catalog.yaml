  optmath_clsp_expand_capacity:
    task_family: lot_sizing
    business_triggers:
      - during a weekly production release review
      - after a short-term capacity shortage was identified
      - before locking a multi-period production plan
      - after demand forecasts were reconciled with line capacity
      - during an inventory buffer recovery planning cycle
    applicability:
      required_source_features:
        - product set
        - time period set
        - continuous Production[i,t] quantity
        - binary Setup[i,t] indicator
        - nonnegative Inventory[i,t]
        - cumulative inventory balance without backlog
        - fixed period capacity limits
        - product capacity consumption rates
        - setup linking by remaining-demand big-M
      incompatible_source_features:
        - backlog variables
        - backlog penalty costs
        - lost sales
        - capacity-expansion variables
        - capacity-expansion costs
        - zero final inventory hard constraint
        - vehicle routes
        - sequencing variables
    required_parameter_presentation:
      - list products and periods
      - list period demand and cumulative demand for every product-period pair
      - list setup cost, unit production cost, holding cost, and setup big-M for every product-period pair
      - list each product capacity-consumption rate
      - list the fixed capacity available in each period
      - state Inventory[i,t] is cumulative production through t minus cumulative demand through t
      - state there are no backlog variables, lost-sales variables, or capacity-expansion variables
    forbidden_misframings:
      - Do not describe unmet demand as backlog.
      - Do not add backlog penalties or lost-sales penalties.
      - Do not introduce capacity expansion or overtime purchase decisions.
      - Do not require final inventory to be exactly zero as a separate hard constraint.
      - Do not treat cumulative demand values as period-by-period demand values.
    modeling_notes:
      - Despite the upstream folder name, the source model has fixed period capacities and no capacity-expansion variable.
      - The inventory equation may be described cumulatively or recursively, but it must not include backlog.
    scenarios:
      - scenario_id: clsp_capacitated_factory_lot_plan
