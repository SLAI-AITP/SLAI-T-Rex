    task_family: production_planning
    business_triggers:
      - before a monthly factory run plan is approved
      - after demand forecasts increased above a single factory's capacity
      - during a regional production cost review
      - before locking factory operating budgets
      - after a plant consolidation proposal changed run-cost assumptions
      - during a capacity-rationing S&OP meeting
    applicability:
      required_source_features:
        - month set
        - factory set
        - binary RunDecision[m,f] variable
        - continuous Production[m,f] variable
        - fixed factory run cost by factory
        - unit production cost by factory
        - minimum and maximum production if running by factory
        - monthly aggregate demand
        - monthly demand satisfaction lower bound
      incompatible_source_features:
        - product-specific inventory carryover
        - backlog or lost-sales variables
        - job sequencing, precedence, or machine order constraints
        - due dates or tardiness penalties
        - transportation arcs or network flow conservation
        - facility opening locations with customer assignment
    required_parameter_presentation:
      - list all factories and months
      - show each factory's fixed run cost per month
      - show each factory's unit production cost
      - show each factory's minimum output if operated
      - show each factory's maximum output if operated
      - show monthly aggregate demand
    forbidden_misframings:
      - Do not describe this as job-shop, flow-shop, machine sequencing, or order scheduling.
      - Do not add inventory, backlog, final stock, or product-level demand.
