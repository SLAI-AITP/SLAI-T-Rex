  optmath_fleet_routing:
    task_family: network_flow
    variant_policy:
      use_only_generator_scenario_lenses: true
      use_only_generator_variation_axes:
        - narrative_angles
        - organization_profiles
        - planning_horizons
        - entity_naming_styles
    business_triggers:
      - after scheduled legs were approved for the next operating window
      - before fleet-positioning decisions are locked for the day
      - after passenger or rider demand changed on listed active legs
      - during a disruption-recovery fleet balance review
      - before assigning vehicle types to a sparse timetable of active legs
      - after available fleet counts changed by vehicle type
    applicability:
      required_source_features:
        - fleet type set
        - location set
        - period set
        - feasible time-expanded leg set with origin, departure period, destination, and arrival period
        - sparse active leg subset with passenger demand
        - nonnegative integer NumPlanes[v,i,t,j,h] variables
        - nonnegative integer idle fleet variables by fleet type, location, and period
        - nonnegative integer initial fleet placement variables
        - fleet type capacity and operating cost
        - available fleet count by type
        - time-expanded fleet conservation constraints
        - inactive leg restriction using leg_is_active
      incompatible_source_features:
        - binary route arc variables
        - customer visit-once constraints
        - subtour elimination constraints
        - customer time windows
        - service times
        - cumulative load propagation
        - depot start/end tour constraints
        - vehicle-to-customer assignment variables
    required_parameter_presentation:
      - list fleet types with capacity, operating cost per assigned leg, and available units
      - list locations and periods
      - list feasible legs as origin, departure period, destination, and arrival period
      - list active legs and passenger demand only for active legs
      - state inactive feasible legs are forbidden by leg_is_active=0 and route restriction
      - state variables are nonnegative integer fleet counts, idle fleet counts, and initial fleet placement counts
      - state this is time-expanded fleet conservation, not visit-once vehicle routing
    forbidden_misframings:
      - Do not introduce binary route-arc or customer-visit variables.
      - Do not add visit-once, subtour, service-time, load-propagation, or customer time-window constraints.
      - Do not create passenger demand on inactive legs.
      - Do not omit idle fleet variables or initial fleet placement variables.
      - Do not turn the problem into independent active-leg covering without fleet conservation.
      - Do not change cost minimization into served-demand maximization.
    modeling_notes:
      - Preserve initial balance separately from later-period conservation.
      - Preserve the route restriction for every feasible leg, including inactive legs.
      - Demand satisfaction applies only to active legs.
      - The word "routing" here means time-expanded fleet flow, not customer-stop VRP.
