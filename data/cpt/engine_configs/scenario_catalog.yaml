  optmath_schedulingproblem:
    task_family: scheduling
    business_triggers:
      - after shift demand was revised
      - before publishing a daily staff roster
      - during a shortage-risk staffing review
      - after employee availability changed
      - before approving a cross-trained coverage plan
    applicability:
      required_source_features:
        - site set
        - employee set
        - shift set
        - skill or role set
        - positive site-shift-skill demand table
        - binary staff assignment variable indexed by site, employee, shift, and skill
        - integer unfilled-position slack variable
        - employee shift availability table
        - employee skill eligibility table
        - employee-skill preference cost table
        - at-most-one total assignment per employee
      incompatible_source_features:
        - machine sequencing
        - job processing times
        - flow-shop common sequence
        - job-shop machine routes
        - due dates or tardiness
        - vehicle routes
        - time-window propagation
    required_parameter_presentation:
      - list sites, employees, shifts, and skills
      - list only positive site-shift-skill demand and state omitted combinations have zero demand
      - list employee availability by shift
      - list employee skill eligibility
      - list employee-skill preference costs
      - state the unfilled-position penalty
      - state each employee can receive at most one total assignment
      - state unfilled positions are allowed but penalized
    forbidden_misframings:
      - Do not describe this as machine sequencing.
      - Do not introduce processing times, machine non-overlap, due dates, or tardiness.
      - Do not remove the unfilled-position slack variable.
      - Do not require every demand slot to be filled without slack.
      - Do not let one employee take multiple assignments.
      - Do not reveal or force any internal demand-generation staff sample.
    modeling_notes:
      - This is a staff coverage assignment MILP, not a sequencing model.
      - Coverage is assigned staff plus unfilled positions equals demand.
      - Availability and skill eligibility are hard constraints on assignment variables.
      - Positive demand should be listed compactly; omitted site-shift-skill combinations have zero demand.
      - Internal demand-generation staff samples are generator-only bookkeeping and must not become business facts.
    scenario_lenses:
      industry_lenses:
        - restaurant operations
        - hospital workforce planning
        - call center operations
        - retail store coverage
        - security services
      narrative_angles:
        - shortage-risk roster with explicit unfilled-position penalty
        - cross-trained staff coverage under availability limits
        - auditable site-shift-skill staffing plan
        - compact positive-demand roster request
    scenarios:
